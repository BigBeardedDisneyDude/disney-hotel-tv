<style>
:root {
  --teal:#0a4a4a; --gold:#c9a84c; --gold-light:#e8c96d; --gold-dim:#8a6e2f;
  --cream:#fdf6e3; --cream-dark:#f5e8c0; --card:#fff9ee;
  --text:#1a1208; --muted:#5a4a2a;
  --sidebar-w:260px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--cream);font-family:'Crimson Pro',Georgia,serif;color:var(--text)}
#shell{display:flex;height:100vh;height:100dvh}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--teal);border-right:1px solid var(--gold-dim);display:flex;flex-direction:column;transition:transform .25s ease;z-index:10}
#sidebar-header{padding:14px 14px 10px;border-bottom:1px solid rgba(201,168,76,.2);display:flex;align-items:center;gap:8px}
#sidebar-title{font-family:'Cinzel',serif;font-size:.75rem;font-weight:600;color:var(--gold-light);letter-spacing:.07em;flex:1}
#new-chat-btn{font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.08em;padding:.22rem .55rem;border-radius:999px;border:1px solid var(--gold-dim);background:transparent;color:var(--gold);cursor:pointer;transition:all .2s;white-space:nowrap}
#new-chat-btn:hover{background:var(--gold);color:var(--teal)}
#chat-list{flex:1;overflow-y:auto;padding:8px 0}
#chat-list::-webkit-scrollbar{width:4px}
#chat-list::-webkit-scrollbar-thumb{background:rgba(201,168,76,.25);border-radius:2px}
.chat-item{padding:9px 14px;cursor:pointer;border-left:2px solid transparent;transition:background .15s}
.chat-item:hover{background:rgba(201,168,76,.08)}
.chat-item.active{background:rgba(201,168,76,.12);border-left-color:var(--gold)}
.chat-item-title{font-family:'Cinzel',serif;font-size:.6rem;color:var(--gold-light);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.chat-item-meta{font-size:.58rem;color:rgba(201,168,76,.5);font-style:italic}
.chat-item-del{float:right;background:none;border:none;cursor:pointer;color:rgba(201,168,76,.3);font-size:.7rem;line-height:1;padding:0 0 0 6px;transition:color .15s}
.chat-item-del:hover{color:#d47070}
.no-chats{font-size:.65rem;color:rgba(201,168,76,.4);font-style:italic;padding:16px 14px;text-align:center;line-height:1.6}
#sidebar-footer{padding:10px 14px;border-top:1px solid rgba(201,168,76,.15);font-size:.52rem;color:rgba(201,168,76,.35);font-style:italic;font-family:'Cinzel',serif;letter-spacing:.04em}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
header{background:var(--teal);border-bottom:2px solid var(--gold);padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:54px;flex-shrink:0;gap:.6rem}
.hdr-left{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1;overflow:hidden}
.home-btn{font-family:'Cinzel',serif;font-size:.6rem;color:var(--gold);text-decoration:none;letter-spacing:.07em;opacity:.75;transition:opacity .2s;white-space:nowrap;flex-shrink:0}
.home-btn:hover{opacity:1}
.hdr-div{width:1px;height:16px;background:var(--gold-dim);opacity:.4;flex-shrink:0}
.hdr-title{font-family:'Cinzel',serif;font-size:.78rem;font-weight:600;color:var(--gold-light);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font-family:'Cinzel',serif;font-size:.82rem;color:var(--gold);letter-spacing:.04em;white-space:nowrap}
#menu-btn{display:none;background:none;border:none;cursor:pointer;color:var(--gold);font-size:1.1rem;padding:4px;flex-shrink:0}

#messages{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;background:var(--cream)}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:var(--cream-dark);border-radius:3px}

.msg{max-width:78%;display:flex;flex-direction:column;gap:4px}
.msg.user{align-self:flex-end}
.msg.assistant{align-self:flex-start}
.bubble{padding:10px 15px;border-radius:12px;font-size:.88rem;line-height:1.65;white-space:pre-wrap}
.user .bubble{background:var(--teal);color:var(--gold-light);border-bottom-right-radius:4px}
.assistant .bubble{background:var(--card);color:var(--text);border:1px solid rgba(138,110,47,.2);border-bottom-left-radius:4px}
.tool-call{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px;padding:3px 0}
.tool-pill{background:rgba(10,74,74,.06);border:1px solid rgba(10,74,74,.15);border-radius:999px;padding:1px 8px;font-size:.52px;color:var(--teal)}
.typing{display:flex;gap:5px;align-items:center;padding:10px 15px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

.welcome{margin:auto;text-align:center;padding:2rem 1rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.welcome-icon{font-size:2.5rem}
.welcome-title{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:600;color:var(--teal);letter-spacing:.06em}
.welcome-sub{font-size:.85rem;color:var(--muted);font-style:italic;max-width:340px;line-height:1.6}
.quick-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:.5rem}
.quick-btn{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.05em;padding:.4rem .85rem;border-radius:999px;border:1px solid var(--gold-dim);background:transparent;color:var(--teal);cursor:pointer;transition:all .2s;white-space:nowrap}
.quick-btn:hover{background:var(--teal);color:var(--gold-light);border-color:var(--teal)}

#input-area{padding:.85rem calc(1.5rem + env(safe-area-inset-right)) calc(1rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));border-top:1px solid rgba(138,110,47,.18);background:var(--cream);flex-shrink:0}
#input-row{display:flex;gap:10px;align-items:flex-end}
#user-input{flex:1;resize:none;border:1px solid var(--gold-dim);border-radius:8px;padding:9px 13px;font-size:.88rem;font-family:'Crimson Pro',serif;background:var(--card);color:var(--text);line-height:1.5;max-height:120px;overflow-y:auto;outline:none;transition:border-color .2s;-webkit-appearance:none}
#user-input:focus{border-color:var(--teal)}
#user-input::placeholder{color:var(--muted);font-style:italic}
#send-btn{width:38px;height:38px;border-radius:50%;background:var(--teal);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s;color:var(--gold-light);font-size:1rem}
#send-btn:disabled{opacity:.35;cursor:not-allowed}

@media(max-width:640px){
  #sidebar{position:fixed;top:0;left:0;height:100%;height:100dvh;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,.3)}
  #menu-btn{display:flex}
  .msg{max-width:90%}

const SB_CONV=`${SUPABASE_URL}/rest/v1/conversations`;
const SB_HDRS={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'};

async function dbLoadChats(){
  try{
    const res=await fetch(`${SB_CONV}?select=id,title,updated_at&order=updated_at.desc&limit=50`,{headers:SB_HDRS});
    if(!res.ok)return[];
    return await res.json();
  }catch(e){return[];}
}
async function dbSaveChat(id,title,messages){
  try{
    await fetch(SB_CONV,{method:'POST',headers:{...SB_HDRS,Prefer:'resolution=merge-duplicates'},
      body:JSON.stringify({id,title,messages,updated_at:new Date().toISOString()})});
  }catch(e){}
}
async function dbLoadMessages(id){
  try{
    const res=await fetch(`${SB_CONV}?id=eq.${id}&select=messages`,{headers:SB_HDRS});
    if(!res.ok)return[];
    const rows=await res.json();
    return rows[0]?.messages||[];
  }catch(e){return[];}
}
async function dbDeleteChat(id){
  try{await fetch(`${SB_CONV}?id=eq.${id}`,{method:'DELETE',headers:SB_HDRS});}catch(e){}
}

let allChats=[],activeChatId=null,conversationHistory=[],isLoading=false;

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function relTime(ts){const d=Date.now()-ts;if(d<60000)return'just now';if(d<3600000)return Math.floor(d/60000)+'m ago';if(d<86400000)return Math.floor(d/3600000)+'h ago';return Math.floor(d/86400000)+'d ago';}

function renderSidebar(){
  const list=document.getElementById('chat-list');
  if(!allChats.length){list.innerHTML='<div class="no-chats">No saved chats yet.<br>Start a conversation!</div>';return;}
  list.innerHTML=allChats.map(c=>`
    <div class="chat-item ${c.id===activeChatId?'active':''}" onclick="loadChat('${c.id}')">
      <button class="chat-item-del" onclick="deleteChat(event,'${c.id}')" title="Delete">✕</button>
      <div class="chat-item-title">${escHtml(c.title)}</div>
      <div class="chat-item-meta">${relTime(new Date(c.updated_at).getTime())}</div>
    </div>`).join('');
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

function welcomeHTML(){
  return`<div class="welcome" id="welcome">

}

async function newChat(){
  await persistCurrent();
  activeChatId=null; conversationHistory=[];
  document.getElementById('messages').innerHTML=welcomeHTML();
  renderSidebar();
  document.getElementById('sidebar').classList.remove('open');
}

async function persistCurrent(){
  if(!activeChatId||!conversationHistory.length)return;
  const now=new Date().toISOString();
  const idx=allChats.findIndex(c=>c.id===activeChatId);
  if(idx!==-1)allChats[idx].updated_at=now;
  const chat=allChats.find(c=>c.id===activeChatId);
  if(chat)await dbSaveChat(activeChatId,chat.title,conversationHistory);
}

async function loadChat(id){
  await persistCurrent();
  activeChatId=id; conversationHistory=[];
  const msgs=document.getElementById('messages');
  msgs.innerHTML='<div class="welcome" id="welcome"><div class="welcome-icon">⏳</div><div class="welcome-title" style="font-size:.8rem">Loading…</div></div>';
  conversationHistory=await dbLoadMessages(id);
  msgs.innerHTML='';
  for(const msg of conversationHistory){
    if(msg.role==='user'&&typeof msg.content==='string') addMessage('user',msg.content,null,true);
    else if(msg.role==='assistant'){
      if(typeof msg.content==='string') addMessage('assistant',msg.content,null,true);
      else if(Array.isArray(msg.content)){
        const tb=msg.content.filter(b=>b.type==='tool_use');
        const txt=msg.content.find(b=>b.type==='text');
        if(tb.length) addMessage('assistant',null,tb.map(b=>({name:b.name})),true);
        if(txt) addMessage('assistant',txt.text,null,true);
      }
    }
  }
  renderSidebar();
  document.getElementById('sidebar').classList.remove('open');
  const m=document.getElementById('messages');m.scrollTop=m.scrollHeight;
}

async function deleteChat(e,id){
  e.stopPropagation();
  allChats=allChats.filter(c=>c.id!==id);
  await dbDeleteChat(id);
  if(activeChatId===id){activeChatId=null;conversationHistory=[];document.getElementById('messages').innerHTML=welcomeHTML();}
  renderSidebar();
}

function chatTitle(text){const c=text.replace(/[^\w\s']/g,'').trim();return c.length>40?c.slice(0,38)+'…':c||'Chat';}

const HRS=['6am','7am','8am','9am','10am','11am','12pm','1pm','2pm','3pm','4pm','5pm','6pm','7pm','8pm','9pm','10pm','11pm'];

const PROXIES=[
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
];
async function fetchProxy(url){
  for(const fn of PROXIES){try{const r=await fetch(fn(url),{signal:AbortSignal.timeout(7000)});if(r.ok)return await r.json();}catch(e){}}
  return null;
}

const TOOLS=[
  {name:'get_wait_times',description:'Get current live wait times for Disneyland or DCA from Queue-Times.',input_schema:{type:'object',properties:{park:{type:'string',enum:['disneyland','dca']}},required:['park']}},
  {name:'get_park_hours',description:"Get today's operating hours for Disneyland or DCA from ThemeParks.wiki.",input_schema:{type:'object',properties:{park:{type:'string',enum:['disneyland','dca']}},required:['park']}},
  {name:'get_weather',description:'Get current weather for Anaheim, CA.',input_schema:{type:'object',properties:{}}},
  {name:'predict_wait_times',description:'Predict wait times using Supabase historical data blended with p[] fallback arrays. Season: holiday(Dec/Jan), summer(Jun-Aug), spring_break(Mar/Apr), regular(all else). Hour index 0=6am..17=11pm. Tags: [data]=Supabase avg, [est]=fallback.',input_schema:{type:'object',properties:{park:{type:'string',enum:['disneyland','dca']},hours:{type:'array',items:{type:'number'},description:'Hours 0-23. Omit for next 3 hours.'},ride_name:{type:'string'}},required:['park']}}
];

async function runTool(name,input){
  if(name==='get_wait_times'){
    const parkId=input.park==='disneyland'?16:17;
    const data=await fetchProxy(`https://queue-times.com/parks/${parkId}/queue_times.json`);
    if(!data?.lands)return'Could not fetch wait times.';
    const rides=data.lands.flatMap(l=>l.rides||[]);
    const open=rides.filter(r=>r.is_open).sort((a,b)=>b.wait_time-a.wait_time);
    if(!open.length)return'No open rides — park may be closed.';
    return`Live waits for ${input.park==='disneyland'?'Disneyland':'DCA'}:\n`+open.slice(0,15).map(r=>`${r.name}: ${r.wait_time} min`).join('\n');
  }
  if(name==='get_park_hours'){
    const ids={disneyland:'7340550b-c14d-4def-80bb-acbe51f931d1',dca:'832fcd51-ea19-4e77-85c7-75d5843b127d'};
    const data=await fetchProxy(`https://api.themeparks.wiki/v1/entity/${ids[input.park]}/schedule`);
    if(!data?.schedule)return'Could not fetch park hours.';
    const todayStr=new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
    const entry=data.schedule.find(s=>s.date===todayStr&&s.type==='OPERATING');
    if(!entry)return`${input.park==='disneyland'?'Disneyland':'DCA'} appears closed today.`;
    return`${input.park==='disneyland'?'Disneyland':'DCA'} today: Opens ${entry.openingTime}, Closes ${entry.closingTime}`;
  }
  if(name==='get_weather'){
    try{
      const res=await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.8121&longitude=-117.9190&current=temperature_2m,apparent_temperature,precipitation_probability,weathercode,windspeed_10m&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=America%2FLos_Angeles');
      const d=await res.json();const c=d.current;
      const wmo={0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',51:'Light drizzle',61:'Slight rain',80:'Light showers'};
      return`Anaheim now: ${Math.round(c.temperature_2m)}°F (feels ${Math.round(c.apparent_temperature)}°F), ${wmo[c.weathercode]||'Mixed'}, wind ${Math.round(c.windspeed_10m)} mph, ${c.precipitation_probability}% rain chance.`;
    }catch(e){return`Weather fetch failed: ${e.message}`;}
  }
  if(name==='predict_wait_times'){
    const pt=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Los_Angeles'}));
    const dow=pt.getDay(),season=getSeason(pt.getMonth()+1);
    const parkKey=input.park==='disneyland'?'dl':'dca';
    const rideList=input.park==='disneyland'?DL:DCA;
    const targetHours=input.hours?.length>0?input.hours:[1,2,3].map(i=>(pt.getHours()+i)%24).filter(h=>h>=6&&h<=23);
    let filteredRides=rideList;
    if(input.ride_name){const q=input.ride_name.toLowerCase();filteredRides=rideList.filter(r=>r.name.toLowerCase().includes(q));if(!filteredRides.length)return`No ride found matching "${input.ride_name}".`;}
    try{
      const params=new URLSearchParams({select:'ride_name,hour_of_day,wait_time',park:`eq.${parkKey}`,day_of_week:`eq.${dow}`,season:`eq.${season}`,is_open:'eq.true','wait_time':'gte.0',limit:'2000'});
      const res=await fetch(`${SUPABASE_URL}/rest/v1/wait_times?${params}`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`},signal:AbortSignal.timeout(8000)});
      const rows=await res.json();
      const buckets={};
      if(Array.isArray(rows))for(const row of rows){const k=`${row.ride_name}|${row.hour_of_day}`;if(!buckets[k])buckets[k]=[];buckets[k].push(row.wait_time);}
      const lines=[];
      for(const hour of targetHours){
        if(hour<6||hour>23)continue;
        const idx=hour-6,label=HRS[idx]||`${hour}:00`;
        lines.push(`\n${label}:`);
        filteredRides.map(ride=>{const k=`${ride.name}|${hour}`;const vals=buckets[k];const wait=(vals&&vals.length>=MIN_SAMPLES)?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):(ride.p[idx]??null);const src=(vals&&vals.length>=MIN_SAMPLES)?'data':'est';return{name:ride.name,wait,src};})
          .filter(r=>r.wait!==null).sort((a,b)=>b.wait-a.wait).slice(0,input.ride_name?99:8)
          .forEach(r=>lines.push(`  ${r.name}: ~${r.wait} min [${r.src}]`));
      }
      const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      return`Predicted waits for ${input.park==='disneyland'?'Disneyland':'DCA'} (${season}, ${days[dow]}):${lines.join('\n')}\n\n[data]=Supabase historical avg  [est]=hardcoded estimate`;
    }catch(e){return`Prediction error: ${e.message}`;}
  }
  return'Unknown tool.';
}

const SYSTEM=`You are MainStreet — a warm, encyclopedic Disney historian and park planning companion. You speak like a lifelong Disney adult who has spent hundreds of days at Disneyland and DCA: you know the lore behind every attraction, the best churro cart locations, which years each land opened, and exactly what the park smells like at rope drop on a cool January morning. You love sharing that knowledge, but you never lecture — you make it feel like a conversation with a well-traveled friend.

You are speaking with Andrew from the Sterner-Cooke family. He is a Magic Key holder (Disneyland annual pass) and a dedicated Disney adult. Tailor all advice accordingly — assume he knows the basics, skip the tourist 101, and treat him like a peer. Reference Magic Key perks (parking, discounts, blockout date awareness) when relevant. He is also a fan of park history and lore, so don't shy away from it.

## Tools
You have four tools — use them proactively, often in combination:
- get_wait_times: live waits from Queue-Times (parks 16=DL, 17=DCA)
- get_park_hours: today's open/close from ThemeParks.wiki
- get_weather: current Anaheim conditions from Open-Meteo
- predict_wait_times: historical Supabase data blended with hardcoded p[] fallbacks, filtered by day_of_week + season (holiday/summer/spring_break/regular). Hours indexed 0=6am through 17=11pm. Results tagged [data] for real averages (≥10 samples) or [est] for fallback estimates.

When someone asks about "today" or "right now," pull live waits AND park hours AND weather in parallel. When someone asks about planning a future visit or time slot, lead with predict_wait_times. Always tell Andrew whether the data is live or estimated.

## Lightning Lane strategy
- ILL (Individual Lightning Lane): Rise of the Resistance (DL), Radiator Springs Racers (DCA) — purchase at or just before park open; these sell out fast
- LLMP top picks DL: Indiana Jones, Haunted Mansion, Space Mountain, Big Thunder Mountain, Matterhorn, Mickey & Minnie's Runaway Railway
- LLMP top picks DCA: Guardians of the Galaxy, Incredicoaster, Toy Story Midway Mania, Soarin', Web Slingers
- Book LLMP at 7am in-app on day of visit; stack your next booking the moment you tap into your current one
- Rope drop strategy: hit your ILL ride first (or its standby if it's short at open), then pivot to the highest-wait headliner before crowds build — typically 45–60 min after open is when lines spike
- Late evening is underrated: waits drop significantly in the last 90 min before close, especially for headliners

## Crowd & timing wisdom
- Lowest crowds: Tuesday–Thursday, avoiding school breaks, January (post-holiday) and early September
- Highest crowds: summer, spring break (Mar–Apr), holiday season (Thanksgiving through New Year), any weekend with a special ticketed event
- Parade and fireworks times clear out headliner queues — use them strategically
- First hour after rope drop and the last 90 min before close are the two golden windows
- Rain is your friend: crowds thin dramatically, most rides stay open, and the park looks magical

## Dining knowledge
**Disneyland:**
- Blue Bayou: iconic, book 60 days out, sit near the water for the Pirates ambiance; Monte Cristo is the move
- Café Orleans: more accessible than Blue Bayou, same New Orleans Square vibes, great pommes frites
- Bengal Barbecue: quick, adventureland skewers — the Outpost Chips with dip are underrated
- Jolly Holiday Bakery: best breakfast stop on Main Street, rose-shaped macaron
- Plaza Inn: fried chicken, character dining at breakfast
- French Market: good quick outdoor option in New Orleans Square, live jazz some evenings
- Carnation Café: classic Main Street sit-down, clam chowder in a bread bowl
- Oga's Cantina (Galaxy's Edge): reservations strongly recommended, themed cocktails and mocktails, limited but fun

**DCA:**
- Lamplight Lounge (Pixar Pier): best full-service restaurant in DCA, lobster nachos, great beer list, book ahead
- Carthay Circle: upscale, beautiful building (replica of the original 1937 Carthay Circle Theatre where Snow White premiered), good for a special occasion
- Flo's V8 Café (Cars Land): solid quick service, the pot roast is a sleeper hit
- Pym Test Kitchen (Avengers Campus): theming is excellent, the Pym-ini is legit good
- Award Wieners: reliable corn dogs on Hollywood Blvd
- Cocina Cucamonga: solid Mexican quick service near Pacific Wharf

## Park history & ride lore (share when relevant, don't force it)
- Disneyland opened July 17, 1955 — the famous "Black Sunday" due to early chaos, counterfeit tickets, a gas leak, and a women's heel-sinking-into-fresh-asphalt situation
- New Orleans Square (1966) was the first new land added to Disneyland after opening, and the first land not in Walt's original plans
- Pirates of the Caribbean (1967) was the last attraction Walt Disney personally supervised before his death in December 1966
- The Haunted Mansion opened in 1969 after years of development — Walt wanted it to be a walk-through; Imagineers convinced him it needed a ride system
- Indiana Jones Adventure (1995) uses the same show building illusion trick as Mystic Manor in Hong Kong — you appear to travel much farther than you actually do
- Galaxy's Edge (2019) is the largest single-land expansion in Disneyland history at 14 acres
- Tiana's Bayou Adventure replaced Splash Mountain in 2024, the first Disneyland attraction based on a Black Disney princess
- DCA opened in 2001 to mixed reviews and has been extensively rebuilt — Buena Vista Street, Cars Land, and Pixar Pier are all post-opening additions
- Radiator Springs Racers (2012) is widely considered one of the best theme park attractions ever built
- The Incredicoaster follows the same track layout as the old California Screamin', just re-themed
- Oga's Cantina occupies the space that used to be the Star Wars Launch Bay, which was previously the Character Meet & Greet building

## Style
- Warm, knowledgeable, never condescending
- Assume Andrew knows the park well — meet him at his level
- Drop in history or lore naturally when it's genuinely interesting, not as a lecture
- Give specific, actionable advice with real ride names and exact timing
- If wait times are high, suggest the best alternative or the best time to retry
- Keep responses focused — don't pad, don't list everything, prioritize the most useful info
- You can have opinions: "Carthay Circle is worth it for a special dinner but Lamplight Lounge is the better everyday choice" is more useful than a neutral list`;

async function callAgent(userMessage){
  if(!activeChatId){
    activeChatId=genId();
    const now=new Date().toISOString();
    allChats.unshift({id:activeChatId,title:chatTitle(userMessage),updated_at:now});
    renderSidebar();
  }
  conversationHistory.push({role:'user',content:userMessage});
  let loops=0;
  while(loops<6){
    loops++;
    const res=await fetch(`${WORKER_URL}/v1/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:SYSTEM,tools:TOOLS,messages:conversationHistory})});
    const data=await res.json();
    const toolBlocks=data.content.filter(b=>b.type==='tool_use');
    const textBlock=data.content.find(b=>b.type==='text');
    if(toolBlocks.length>0){
      conversationHistory.push({role:'assistant',content:data.content});
      hideTyping();
      addMessage('assistant',null,toolBlocks.map(b=>({name:b.name})));
      showTyping();
      const results=await Promise.all(toolBlocks.map(async b=>({type:'tool_result',tool_use_id:b.id,content:await runTool(b.name,b.input)})));
      conversationHistory.push({role:'user',content:results});
      continue;
    }
    if(textBlock){
      conversationHistory.push({role:'assistant',content:textBlock.text});
      hideTyping();addMessage('assistant',textBlock.text);await persistCurrent();return;
    }
    hideTyping();addMessage('assistant','Something went wrong — please try again.');return;
  }
  hideTyping();addMessage('assistant','Got turned around — try rephrasing!');
}

function addMessage(role,content,toolCalls,silent){
  const msgs=document.getElementById('messages');
  document.getElementById('welcome')?.remove();
  const div=document.createElement('div');div.className=`msg ${role}`;
  if(toolCalls?.length)toolCalls.forEach(tc=>{const p=document.createElement('div');p.className='tool-call';p.innerHTML=`⚙ <span class="tool-pill">${tc.name}</span>`;div.appendChild(p);});
  if(content){const b=document.createElement('div');b.className='bubble';b.textContent=content;div.appendChild(b);}
  msgs.appendChild(div);
  if(!silent)msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){const msgs=document.getElementById('messages');const d=document.createElement('div');d.className='msg assistant';d.id='typing-indicator';d.innerHTML='<div class="bubble typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
function hideTyping(){document.getElementById('typing-indicator')?.remove();}

async function sendMessage(){
  const input=document.getElementById('user-input');
  const text=input.value.trim();
  if(!text||isLoading)return;
  isLoading=true;document.getElementById('send-btn').disabled=true;
  input.value='';input.style.height='auto';
  addMessage('user',text);showTyping();
  try{await callAgent(text);}catch(e){hideTyping();addMessage('assistant',`Error: ${e.message}`);}
  isLoading=false;document.getElementById('send-btn').disabled=false;input.focus();
}
function sendQuick(btn){document.getElementById('user-input').value=btn.textContent;sendMessage();}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}

function tick(){const n=new Date();let h=n.getHours();const m=String(n.getMinutes()).padStart(2,'0'),ap=h>=12?'PM':'AM';h=h%12||12;document.getElementById('clock').textContent=`${h}:${m} ${ap}`;}
setInterval(tick,1000);tick();
(async()=>{allChats=await dbLoadChats();renderSidebar();})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('mainstreet-sw.js').catch(()=>{});}
