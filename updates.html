<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disney Updates — Disneyland Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@200;300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a84c; --gold-light: #e8cc7a;
    --teal-dark: #1a3a4a; --warm-white: #fff8ee;
  }
  html, body { width:100%; min-height:100%; background:var(--teal-dark); font-family:'Raleway',sans-serif; cursor:default; color:var(--warm-white); }

  #header {
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:linear-gradient(180deg,rgba(22,52,68,1) 0%,rgba(22,52,68,.98) 100%);
    box-shadow:0 4px 20px rgba(0,0,0,.5); border-bottom:2px solid var(--gold);
    padding:18px 40px; display:flex; align-items:center; justify-content:space-between; min-height:80px;
  }
  #header-left { display:flex; align-items:center; gap:20px; }
  #back-btn {
    font-family:'Raleway',sans-serif; font-weight:300; font-size:11px; letter-spacing:.25em;
    color:var(--gold); text-transform:uppercase; background:none;
    border:1px solid rgba(201,168,76,.35); border-radius:3px; padding:7px 16px;
    cursor:pointer; transition:all .25s;
  }
  #back-btn:hover { background:rgba(201,168,76,.12); border-color:var(--gold); }
  #back-btn::before { content:'← '; }
  #wordmark { display:flex; flex-direction:column; gap:1px; }
  .dh-logo { font-family:'Cinzel',serif; font-weight:400; font-size:18px; letter-spacing:.10em; color:var(--warm-white); }
  .d-letter { font-style:italic; color:var(--gold-light); }
  .dh-sub { font-family:'Raleway',sans-serif; font-weight:200; font-size:8px; letter-spacing:.38em; color:var(--gold); text-transform:uppercase; opacity:.85; }
  #header-right { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  #page-title { font-family:'Cinzel',serif; font-weight:600; font-size:22px; letter-spacing:.08em; color:var(--warm-white); }
  #page-subtitle { font-family:'Raleway',sans-serif; font-weight:200; font-size:10px; letter-spacing:.3em; color:var(--gold-light); text-transform:uppercase; }

  #main { padding:100px 40px 60px; max-width:1100px; margin:0 auto; }

  #toolbar {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:28px; padding-bottom:16px;
    border-bottom:1px solid rgba(201,168,76,.2); gap:16px; flex-wrap:wrap;
  }
  #status-text { font-family:'Raleway',sans-serif; font-weight:300; font-size:11px; letter-spacing:.2em; color:rgba(255,248,238,.45); text-transform:uppercase; }
  #source-wrapper { position:relative; }
  #source-select {
    appearance:none; -webkit-appearance:none;
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:.18em;
    color:var(--gold); background:rgba(22,52,68,.9);
    border:1px solid rgba(201,168,76,.4); border-radius:3px;
    padding:8px 36px 8px 14px; cursor:pointer; outline:none; transition:border-color .2s;
  }
  #source-select:hover,#source-select:focus { border-color:var(--gold); }
  #source-select option { background:#1a3a4a; color:var(--warm-white); font-family:sans-serif; }
  #source-arrow { position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--gold); font-size:10px; }

  #loading { display:flex; flex-direction:column; align-items:center; gap:16px; padding:80px 0; }
  .spinner { width:40px; height:40px; border:2px solid rgba(201,168,76,.2); border-top-color:var(--gold); border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading p { font-family:'Raleway',sans-serif; font-weight:200; font-size:11px; letter-spacing:.3em; color:rgba(255,248,238,.4); text-transform:uppercase; }
  #loading small { font-family:'Raleway',sans-serif; font-weight:200; font-size:10px; color:rgba(255,248,238,.25); letter-spacing:.1em; }

  #error { display:none; text-align:center; padding:60px 0; }
  #error p { font-family:'Raleway',sans-serif; font-weight:300; font-size:13px; letter-spacing:.06em; color:rgba(255,248,238,.5); margin-bottom:8px; line-height:1.9; }
  #error .err-detail { font-size:11px; color:rgba(255,248,238,.25); letter-spacing:.1em; margin-bottom:24px; }
  #retry-btn { font-family:'Raleway',sans-serif; font-weight:300; font-size:11px; letter-spacing:.25em; color:var(--gold); text-transform:uppercase; background:none; border:1px solid rgba(201,168,76,.4); border-radius:3px; padding:8px 22px; cursor:pointer; transition:all .25s; }
  #retry-btn:hover { background:rgba(201,168,76,.1); }

  #empty { display:none; text-align:center; padding:80px 0; }
  #empty p { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:18px; color:rgba(255,248,238,.3); }

  #articles { display:none; flex-direction:column; }
  .article-card {
    display:flex; gap:24px; padding:22px 16px; margin:0 -16px;
    border-bottom:1px solid rgba(201,168,76,.1);
    text-decoration:none; cursor:pointer; border-radius:4px;
    transition:background .2s; animation:fadeIn .35s ease both;
  }
  .article-card:hover { background:rgba(255,248,238,.04); }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .article-thumb { flex-shrink:0; width:140px; height:88px; border-radius:3px; overflow:hidden; background:rgba(255,255,255,.04); border:1px solid rgba(201,168,76,.12); }
  .article-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .no-img { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .no-img svg { width:28px; height:28px; fill:rgba(201,168,76,.2); }
  .article-body { flex:1; display:flex; flex-direction:column; gap:7px; justify-content:center; }
  .article-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .article-source { font-family:'Cinzel',serif; font-size:9px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase; }
  .article-date { font-family:'Raleway',sans-serif; font-weight:300; font-size:10px; letter-spacing:.12em; color:rgba(255,248,238,.38); text-transform:uppercase; }
  .article-new { font-family:'Raleway',sans-serif; font-size:9px; font-weight:600; letter-spacing:.15em; color:#1a3a4a; background:var(--gold); padding:2px 7px; border-radius:2px; text-transform:uppercase; }
  .article-title { font-family:'Cinzel',serif; font-weight:600; font-size:15px; letter-spacing:.02em; color:var(--warm-white); line-height:1.35; transition:color .2s; }
  .article-card:hover .article-title { color:var(--gold-light); }
  .article-desc { font-family:'Raleway',sans-serif; font-weight:300; font-size:12px; line-height:1.6; color:rgba(255,248,238,.5); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .article-cta { font-family:'Raleway',sans-serif; font-weight:300; font-size:10px; letter-spacing:.22em; color:var(--gold); text-transform:uppercase; opacity:0; transition:opacity .2s; }
  .article-card:hover .article-cta { opacity:1; }
  .article-card:nth-child(1){animation-delay:.04s} .article-card:nth-child(2){animation-delay:.08s}
  .article-card:nth-child(3){animation-delay:.12s} .article-card:nth-child(4){animation-delay:.16s}
  .article-card:nth-child(5){animation-delay:.20s} .article-card:nth-child(6){animation-delay:.24s}
  .article-card:nth-child(7){animation-delay:.28s} .article-card:nth-child(8){animation-delay:.32s}
  .ornament { text-align:center; margin:40px 0 8px; color:rgba(201,168,76,.2); font-size:16px; letter-spacing:.5em; }

  .ai-badge {
    display:inline-flex; align-items:center; gap:5px;
    font-family:'Raleway',sans-serif; font-weight:300; font-size:9px; letter-spacing:.18em;
    color:rgba(201,168,76,.5); text-transform:uppercase;
    border:1px solid rgba(201,168,76,.15); border-radius:3px; padding:3px 8px;
    margin-left:8px;
  }
  .ai-dot { width:5px; height:5px; border-radius:50%; background:var(--gold); opacity:.5; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.9} }
</style>
</head>
<body>

<div id="header">
  <div id="header-left">
    <button id="back-btn" onclick="history.back()">Home</button>
    <div id="wordmark">
      <div class="dh-logo"><span class="d-letter">D</span>isneyland Hotel</div>
      <div class="dh-sub">Anaheim · California</div>
    </div>
  </div>
  <div id="header-right">
    <div id="page-title">Disney Updates</div>
    <div id="page-subtitle">Resort News &amp; Announcements</div>
  </div>
</div>

<div id="main">
  <div id="toolbar">
    <div id="status-text">Loading… <span class="ai-badge"><span class="ai-dot"></span>AI Powered</span></div>
    <div id="source-wrapper">
      <select id="source-select" onchange="loadFeed()">
        <option value="micechat">MiceChat</option>
        <option value="disneyparks">Disney Parks Blog</option>
        <option value="both">All Sources</option>
      </select>
      <span id="source-arrow">▾</span>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Searching for latest updates…</p>
    <small id="proxy-label">Powered by Claude AI web search</small>
  </div>
  <div id="error">
    <p>Unable to load updates right now.</p>
    <p class="err-detail" id="err-detail"></p>
    <button id="retry-btn" onclick="loadFeed()">Try Again</button>
  </div>
  <div id="empty"><p>No updates found from the past 7 days.</p></div>
  <div id="articles"></div>
  <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
</div>

<script>
const SOURCES = {
  micechat:    { label: 'MiceChat',          query: 'site:micechat.com Disneyland news' },
  disneyparks: { label: 'Disney Parks Blog', query: 'site:disneyparks.disney.go.com/blog Disneyland' },
  both:        { label: 'Disney News',       query: 'Disneyland news announcements MiceChat OR disneyparks.disney.go.com' }
};

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins  = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days  = Math.floor(diff / 86400000);
  if (mins < 1)   return 'just now';
  if (mins < 60)  return `${mins}m ago`;
  if (hours < 24) return `${hours}h ago`;
  return `${days}d ago`;
}

function isNew(d) {
  if (!d) return false;
  return (Date.now() - new Date(d).getTime()) < 86400000;
}

function noImg() {
  return `<div class="no-img"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>`;
}

function setState(s) {
  document.getElementById('loading').style.display  = s==='loading' ? 'flex'  : 'none';
  document.getElementById('error').style.display    = s==='error'   ? 'block' : 'none';
  document.getElementById('empty').style.display    = s==='empty'   ? 'block' : 'none';
  document.getElementById('articles').style.display = s==='done'    ? 'flex'  : 'none';
}

function renderArticles(items, label) {
  if (!items || !items.length) { setState('empty'); return; }

  document.getElementById('status-text').innerHTML =
    `${items.length} update${items.length!==1?'s':''} found <span class="ai-badge"><span class="ai-dot"></span>AI Powered</span>`;

  const c = document.getElementById('articles');
  c.innerHTML = '';
  items.forEach(it => {
    const card = document.createElement('a');
    card.className = 'article-card';
    card.href = it.link || '#';
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    const srcLabel = it.source || label;
    const dateDisplay = it.pubDate ? timeAgo(it.pubDate) : (it.dateLabel || '');
    card.innerHTML = `
      <div class="article-thumb">${it.thumb ? `<img src="${it.thumb}" alt="" loading="lazy" onerror="this.parentElement.innerHTML=\`${noImg()}\`">` : noImg()}</div>
      <div class="article-body">
        <div class="article-meta">
          <span class="article-source">${srcLabel}</span>
          ${dateDisplay ? `<span class="article-date">${dateDisplay}</span>` : ''}
          ${isNew(it.pubDate) ? '<span class="article-new">New</span>' : ''}
        </div>
        <div class="article-title">${it.title || 'Untitled'}</div>
        ${it.desc ? `<div class="article-desc">${it.desc}</div>` : ''}
        <div class="article-cta">Read Article →</div>
      </div>`;
    c.appendChild(card);
  });
  setState('done');
}

async function callClaude(messages, systemPrompt) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 2000,
      system: systemPrompt,
      tools: [{ type: 'web_search_20250305', name: 'web_search' }],
      messages
    })
  });
  if (!response.ok) {
    const errData = await response.json().catch(() => ({}));
    throw new Error(errData.error?.message || `API error ${response.status}`);
  }
  return response.json();
}

function extractJsonArray(text) {
  if (!text) return null;
  const clean = text.replace(/```json|```/gi, '').trim();
  const start = clean.indexOf('[');
  const end = clean.lastIndexOf(']');
  if (start === -1 || end === -1) return null;
  return JSON.parse(clean.slice(start, end + 1));
}

async function loadFeed() {
  const key = document.getElementById('source-select').value;
  const src = SOURCES[key];
  setState('loading');
  document.getElementById('status-text').innerHTML = 'Loading… <span class="ai-badge"><span class="ai-dot"></span>AI Powered</span>';
  document.getElementById('proxy-label').textContent = 'Powered by Claude AI web search';

  const today = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  const systemPrompt = `You are a Disney news aggregator. Search the web for recent Disneyland and Disney Parks news, then return ONLY a valid JSON array — no preamble, no markdown fences, no explanation. Just the raw JSON array.

Each object in the array must have:
- title: string
- link: string (full URL)
- desc: string (1-2 sentence plain text summary)
- pubDate: string (ISO 8601 if known, else "")
- dateLabel: string (readable date like "April 25, 2026" if pubDate unknown)
- source: string (e.g. "MiceChat" or "Disney Parks Blog")
- thumb: string (image URL if available, else "")

Return 5–12 articles. Most recent first. Output ONLY the JSON array.`;

  const userPrompt = `Today is ${today}. Search for the latest Disneyland and Disney Parks news from ${src.label === 'Disney News' ? 'MiceChat and the Disney Parks Blog' : src.label} — articles from the past 2 weeks. Return as a JSON array only.`;

  try {
    // Turn 1: initial request, model will use web_search tool
    let messages = [{ role: 'user', content: userPrompt }];
    let data = await callClaude(messages, systemPrompt);

    // Agentic loop: keep going while the model is using tools
    let iterations = 0;
    while (data.stop_reason === 'tool_use' && iterations < 5) {
      iterations++;
      document.getElementById('proxy-label').textContent = `Searching the web… (step ${iterations})`;

      // Build tool_result blocks for every tool_use block in the response
      const toolResults = (data.content || [])
        .filter(b => b.type === 'tool_use')
        .map(b => ({
          type: 'tool_result',
          tool_use_id: b.id,
          content: b.type === 'tool_use' ? (b.content || '') : ''
        }));

      // Append assistant turn + user turn with tool results
      messages = [
        ...messages,
        { role: 'assistant', content: data.content },
        { role: 'user', content: toolResults }
      ];

      data = await callClaude(messages, systemPrompt);
    }

    // Now extract the final text response
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    const fullText = textBlocks.join('');

    if (!fullText.trim()) throw new Error('No text in final response');

    const items = extractJsonArray(fullText);
    if (!items || !Array.isArray(items)) throw new Error('Could not parse JSON from response');

    renderArticles(items, src.label);

  } catch (e) {
    console.error('Feed load failed:', e);
    setState('error');
    document.getElementById('err-detail').textContent = e.message || 'Unknown error';
    document.getElementById('status-text').textContent = 'Failed to load';
  }
}

loadFeed();
</script>
</body>
</html>
