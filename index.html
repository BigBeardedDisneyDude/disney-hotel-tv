  @keyframes kenBurns {
    0%   { transform: scale(1.00) translate(0%, 0%); }
    33%  { transform: scale(1.04) translate(-0.8%, 0.3%); }
    66%  { transform: scale(1.06) translate(0.5%, -0.4%); }
    100% { transform: scale(1.03) translate(-0.3%, 0.6%); }
  }

  /* subtle dark vignette over photo */
  #bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(0,0,0,0.0) 0%,
        rgba(0,0,0,0.0) 18%,
        rgba(0,0,0,0.00) 40%,
        rgba(0,0,0,0.00) 55%,
        rgba(0,0,0,0.35) 75%,
        rgba(0,0,0,1.00) 100%
      );
  }

  /* ── TOP HEADER BAR ── */
  #header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: linear-gradient(180deg,
      rgba(22,52,68,1.00) 0%,
      rgba(22,52,68,1.00) 95%,
      rgba(22,52,68,0.96) 100%
    );
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border-bottom: 2px solid var(--gold);
    padding: 22px 36px 20px;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Header left column */
  #header-left {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #welcome-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* Wordmark */
  #wordmark {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  #wordmark .dh-logo {
    font-family: 'Cinzel', serif;
    font-weight: 400;
    font-size: 20px;
    letter-spacing: 0.10em;
    color: var(--warm-white);
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  #wordmark .dh-logo .d-letter {
    font-style: italic;
    color: var(--gold-light);
  }
  #wordmark .dh-sub {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 9px;
    letter-spacing: 0.38em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.85;
    margin-top: 1px;
  }

  #weather-block {

  }

  .menu-item {

    transition: transform 0.3s ease, filter 0.3s;
    min-width: 120px;

  .menu-icon {

    height: 36px;

    stroke: none;
  }
  .menu-label {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: rgba(20,50,65,0.92);
    text-transform: uppercase;
    text-align: center;
    line-height: 1.2;
  }
  .menu-sublabel {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: rgba(20,50,65,0.65);
    text-transform: uppercase;
    text-align: center;
  }

  /* vertical gold dividers between items */
  .menu-divider {
    width: 1px;
    height: 60px;
    background: linear-gradient(180deg, transparent, rgba(20,50,65,0.25), transparent);
  }

  /* ── MUSIC BUTTON ── */
  #music-btn {
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    background: rgba(22,52,68,0.80);
    border: 1px solid rgba(201,168,76,0.4);
    border-top: none;
    border-radius: 0 0 20px 20px;
    padding: 5px 22px 7px;
    color: var(--gold-light);
    font-family: 'Raleway', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 200;
    transition: all 0.3s;
    backdrop-filter: blur(8px);
  }
  #music-btn:hover {
    background: rgba(201,168,76,0.2);
    border-color: rgba(201,168,76,0.7);
  }

  /* hidden audio */
  #bg-audio { display: none; }

  /* weather loading */
  #weather-loading {
    font-size: 11px;
    color: rgba(255,248,238,0.5);
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    letter-spacing: 0.15em;
  }

  /* fade in */
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  body { animation: fadeIn 1.5s ease-out; }
</style>
</head>
<body>

<div id="bg"></div>

<!-- HEADER -->

<!-- BACKGROUND AUDIO -->
<audio id="bg-audio" loop crossorigin="anonymous">
  <source src="https://archive.org/download/C08.MainStreetUSAAreaBackgroundMusic/C08.MainStreetUSAAreaBackgroundMusic_vbr.mp3" type="audio/mpeg">
  <source src="https://archive.org/download/11DisneylandSongParade/11DisneylandSongParade_vbr.mp3" type="audio/mpeg">
</audio>

<script>
// ── CLOCK ──
function updateClock() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  document.getElementById('time-display').textContent =
    h12 + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
  document.getElementById('date-display').textContent =
    days[now.getDay()].toUpperCase() + ', ' + months[now.getMonth()].toUpperCase() + ' ' + now.getDate() + 'TH';

  // greeting
  const greet = h >= 5 && h < 12 ? 'Good Morning' :
                h >= 12 && h < 17 ? 'Good Afternoon' :
                h >= 17 && h < 21 ? 'Good Evening' : 'Good Night';
  document.getElementById('greeting-line').textContent = greet;
}
updateClock();
setInterval(updateClock, 30000);

// ── WEATHER (Open-Meteo, no API key needed) ──
function fetchWeather(lat, lon) {
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
    '&longitude=' + lon +
    '&current_weather=true&temperature_unit=fahrenheit&wind_speed_unit=mph';
  fetch(url)
    .then(r => r.json())
    .then(data => {
      const cw = data.current_weather;
      const temp = Math.round(cw.temperature) + '°F';
      const code = cw.weathercode;
      let icon = '☀️', desc = 'Clear';
      if (code >= 1 && code <= 3) { icon = '⛅'; desc = 'Partly Cloudy'; }
      if (code >= 45 && code <= 48) { icon = '🌫️'; desc = 'Foggy'; }
      if (code >= 51 && code <= 67) { icon = '🌧️'; desc = 'Rain'; }
      if (code >= 71 && code <= 77) { icon = '❄️'; desc = 'Snow'; }
      if (code >= 80 && code <= 82) { icon = '🌦️'; desc = 'Showers'; }
      if (code >= 95) { icon = '⛈️'; desc = 'Thunderstorm'; }
      document.getElementById('weather-loading').style.display = 'none';
      document.getElementById('weather-temp').textContent = temp;
      document.getElementById('weather-icon').textContent = icon;
      document.getElementById('weather-desc').textContent = desc;
    })
    .catch(() => {
      document.getElementById('weather-loading').textContent = '';
    });
}

// Request geolocation
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
    () => {
      // fallback: Anaheim CA coords
      fetchWeather(33.8366, -117.9143);
    }
  );
} else {
  fetchWeather(33.8366, -117.9143);
}

// ── MUSIC ──
const audio = document.getElementById('bg-audio');
audio.volume = 0.4;

function handleMusicBtn() {
  const btn = document.getElementById('music-btn');
  if (audio.paused) {
    audio.play().then(() => {
      btn.textContent = '♪ Pause Music';
    }).catch(e => console.log('Audio error:', e));
  } else {
    audio.pause();
    btn.textContent = '♪ Play Music';
  }
}
</script>
</body>
