    background-position: center 45%;
    animation: kenBurns 30s ease-in-out infinite alternate;

  }

  @keyframes kenBurns {
    0%   { transform: scale(1.00) translate(0%, 0%); }
    33%  { transform: scale(1.01) translate(-0.3%, 0.1%); }
    66%  { transform: scale(1.02) translate(0.2%, -0.2%); }
    100% { transform: scale(1.01) translate(-0.1%, 0.2%); }
  }

  /* subtle dark vignette over photo */
  #bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(0,0,0,0.0) 0%,
        rgba(0,0,0,0.0) 18%,
        rgba(0,0,0,0.00) 40%,
        rgba(0,0,0,0.00) 55%,
        rgba(0,0,0,0.35) 75%,
        rgba(0,0,0,1.00) 100%
      );
  }

  /* ── TOP HEADER BAR ── */
  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: linear-gradient(180deg,
      rgba(22,52,68,1.00) 0%,
      rgba(22,52,68,1.00) 95%,
      rgba(22,52,68,0.96) 100%
    );
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border-bottom: 2px solid var(--gold);
    padding: 22px 36px 20px;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Header left column */
  #header-left {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #welcome-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* Wordmark */
  #wordmark {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  #wordmark .dh-logo {
    font-family: 'Cinzel', serif;
    font-weight: 400;
    font-size: 20px;
    letter-spacing: 0.10em;
    color: var(--warm-white);
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  #wordmark .dh-logo .d-letter {
    font-style: italic;
    color: var(--gold-light);
  }
  #wordmark .dh-sub {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 9px;
    letter-spacing: 0.38em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.85;
    margin-top: 1px;
  }

  /* Weather + clock right column */
  #info-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    gap: 4px;
  }
  #greeting-line {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--gold-light);
    text-transform: uppercase;
  }
  #welcome-name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.04em;
    color: var(--warm-white);
    text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    line-height: 1.0;
  }
  #weather-time-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 3px;
  }
  #weather-block {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Raleway', sans-serif;
  }
  #weather-icon {
    font-size: 20px;
    line-height: 1;
  }
  #weather-temp {
    font-size: 24px;
    font-weight: 300;
    color: var(--warm-white);
    letter-spacing: 0.02em;
  }
  #weather-desc {
    font-size: 11px;
    font-weight: 200;
    color: rgba(255,248,238,0.7);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    align-self: flex-end;
    margin-bottom: 2px;
  }
  #time-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  #time-display {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 30px;
    color: var(--warm-white);
    letter-spacing: 0.06em;
    line-height: 1.0;
  }
  #date-display {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold-light);
    text-transform: uppercase;
    opacity: 0.85;
    margin-top: 1px;
  }

  /* gold divider line */
  #header-divider {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      var(--gold) 15%,
      var(--gold-light) 50%,
      var(--gold) 85%,
      transparent 100%
    );
    z-index: 101;
  }

  /* ── BOTTOM GOLD MENU BAR ── */
  #menu-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    background: linear-gradient(180deg,
      rgba(180,138,42,1.00) 0%,
      rgba(160,118,30,1.00) 100%
    );
    border-top: 1.5px solid rgba(255,220,100,0.4);
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 60px;
  }

  .menu-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.3s ease, filter 0.3s;
    min-width: 120px;
    padding: 10px 20px;
    border-radius: 4px;
    position: relative;
  }
  .menu-item::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.0);
    border-radius: 4px;
    transition: background 0.25s;
  }
  .menu-item:hover {
    transform: translateY(-4px);
    filter: brightness(1.15);
  }
  .menu-item:hover::after {
    background: rgba(255,255,255,0.08);
  }

  .menu-icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .menu-icon svg {
    width: 36px;
    height: 36px;
    fill: rgba(20,50,65,0.9);
    stroke: none;
  }
  .menu-label {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: rgba(20,50,65,0.92);
    text-transform: uppercase;
    text-align: center;
    line-height: 1.2;
  }
  .menu-sublabel {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: rgba(20,50,65,0.65);
    text-transform: uppercase;
    text-align: center;
  }

  /* vertical gold dividers between items */
  .menu-divider {
    width: 1px;
    height: 60px;
    background: linear-gradient(180deg, transparent, rgba(20,50,65,0.25), transparent);
  }

  /* ── MUSIC BUTTON ── */
  #music-btn {
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    background: rgba(22,52,68,0.80);
    border: 1px solid rgba(201,168,76,0.4);
    border-top: none;
    border-radius: 0 0 20px 20px;
    padding: 5px 22px 7px;
    color: var(--gold-light);
    font-family: 'Raleway', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 200;
    transition: all 0.3s;
    backdrop-filter: blur(8px);
  }
  #music-btn:hover {
    background: rgba(201,168,76,0.2);
    border-color: rgba(201,168,76,0.7);
  }

  /* hidden audio */
  #bg-audio { display: none; }

  /* weather loading */
  #weather-loading {
    font-size: 11px;
    color: rgba(255,248,238,0.5);
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    letter-spacing: 0.15em;
  }

  /* fade in */
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  body { animation: fadeIn 1.5s ease-out; }
</style>
</head>
<body>

<div id="bg"></div>

<!-- MUSIC BUTTON -->
<button id="music-btn" onclick="handleMusicBtn()">♪ Play Music</button>

<!-- HEADER -->
<div id="header-divider"></div>
<div id="header">
  <div id="header-left">

      <div class="dh-logo"><span class="d-letter">D</span>isneyland Hotel</div>
    </div>
    <div id="welcome-block">

  <div id="info-right">
    <div id="weather-time-row">
      <div id="weather-block">
        <span id="weather-icon">☀️</span>

<!-- BOTTOM MENU BAR -->
<div id="menu-bar">

    <div class="menu-icon">

  <div class="menu-divider"></div>

  <!-- Park Hours -->
  <div class="menu-item" onclick="window.open('https://disneyland.disney.go.com/calendars/day/#/disneyland,downtown-disney-district,disney-california-adventure/', '_blank')">
    <div class="menu-icon">
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(20,50,65,0.9)" stroke-width="2.5"/>
        <circle cx="18" cy="18" r="15"/>
        <line x1="18" y1="18" x2="18" y2="8" stroke="rgba(180,138,42,1)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="18" y1="18" x2="24" y2="21" stroke="rgba(180,138,42,1)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="18" cy="18" r="1.5" fill="rgba(180,138,42,1)"/>
      </svg>

    <div class="menu-label">Park Hours</div>
    <div class="menu-sublabel">Today's Schedule</div>
  </div>

  <div class="menu-divider"></div>

  <!-- Resort Map -->
  <div class="menu-item" onclick="window.open('https://disneyland.disney.go.com/maps/', '_blank')">
    <div class="menu-icon">
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <polygon points="2,6 12,2 24,6 34,2 34,30 24,34 12,30 2,34" fill="none" stroke="rgba(20,50,65,0.9)" stroke-width="2.5"/>
        <polygon points="2,6 12,2 24,6 34,2 34,30 24,34 12,30 2,34"/>

<!-- BACKGROUND AUDIO via SoundCloud embed -->
<iframe id="sc-player"
  src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/sergio-meza-26/disneyland-resort-esplanade&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
  style="position:absolute;top:-9999px;left:-9999px;width:1px;height:1px;"
  allow="autoplay">
</iframe>

<script>
// ── CLOCK ──
function updateClock() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  document.getElementById('time-display').textContent =
    h12 + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
  document.getElementById('date-display').textContent =
    days[now.getDay()].toUpperCase() + ', ' + months[now.getMonth()].toUpperCase() + ' ' + now.getDate() + 'TH';

  // greeting
  const greet = h >= 5 && h < 12 ? 'Good Morning' :
                h >= 12 && h < 17 ? 'Good Afternoon' :
                h >= 17 && h < 21 ? 'Good Evening' : 'Good Night';
  document.getElementById('greeting-line').textContent = greet;
}
updateClock();
setInterval(updateClock, 30000);

// ── WEATHER (Open-Meteo, no API key needed) ──
function fetchWeather(lat, lon) {
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
    '&longitude=' + lon +
    '&current_weather=true&temperature_unit=fahrenheit&wind_speed_unit=mph';
  fetch(url)
    .then(r => r.json())
    .then(data => {
      const cw = data.current_weather;
      const temp = Math.round(cw.temperature) + '°F';
      const code = cw.weathercode;
      let icon = '☀️', desc = 'Clear';
      if (code >= 1 && code <= 3) { icon = '⛅'; desc = 'Partly Cloudy'; }
      if (code >= 45 && code <= 48) { icon = '🌫️'; desc = 'Foggy'; }
      if (code >= 51 && code <= 67) { icon = '🌧️'; desc = 'Rain'; }
      if (code >= 71 && code <= 77) { icon = '❄️'; desc = 'Snow'; }
      if (code >= 80 && code <= 82) { icon = '🌦️'; desc = 'Showers'; }
      if (code >= 95) { icon = '⛈️'; desc = 'Thunderstorm'; }
      document.getElementById('weather-loading').style.display = 'none';
      document.getElementById('weather-temp').textContent = temp;
      document.getElementById('weather-icon').textContent = icon;
      document.getElementById('weather-desc').textContent = desc;
    })
    .catch(() => {
      document.getElementById('weather-loading').textContent = '';
    });
}

// Request geolocation
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
    () => {
      // fallback: Anaheim CA coords
      fetchWeather(33.8366, -117.9143);
    }
  );
} else {
  fetchWeather(33.8366, -117.9143);
}

// ── MUSIC via SoundCloud Widget API ──
const scScript = document.createElement('script');
scScript.src = 'https://w.soundcloud.com/player/api.js';
document.head.appendChild(scScript);

let scWidget = null;
let scReady = false;
let scPlaying = false;

scScript.onload = function() {
  scWidget = SC.Widget(document.getElementById('sc-player'));
  scWidget.bind(SC.Widget.Events.READY, function() {
    scReady = true;
    scWidget.setVolume(40);
  });
  scWidget.bind(SC.Widget.Events.PLAY, function() { scPlaying = true; });
  scWidget.bind(SC.Widget.Events.PAUSE, function() { scPlaying = false; });
};

function handleMusicBtn() {
  const btn = document.getElementById('music-btn');
  if (!scReady) return;
  if (scPlaying) {
    scWidget.pause();
    btn.textContent = '♪ Play Music';
  } else {
    scWidget.play();
    btn.textContent = '♪ Pause Music';
  }
}
</script>
</body>
</html>
