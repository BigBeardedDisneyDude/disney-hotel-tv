<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disneyland Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8cc7a;
    --gold-pale: #f5e6b8;
    --teal-dark: #1a3a4a;
    --teal-mid: #1e4a5e;
    --teal-header: #1b3c50;
    --cream: #f8f2e4;
    --warm-white: #fff8ee;
    --bar-gold: #c8a03a;
    --bar-gold-light: #e6c056;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Raleway', sans-serif;
    cursor: default;
  }

  /* ── BACKGROUND PHOTO ── */
  #bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('bg.jpg');
    background-size: cover;
    background-position: center 45%;
    animation: kenBurns 30s ease-in-out infinite alternate;
    transform-origin: center center;
  }

  @keyframes kenBurns {
    0%   { transform: scale(1.00) translate(0%, 0%); }
    33%  { transform: scale(1.01) translate(-0.3%, 0.1%); }
    66%  { transform: scale(1.02) translate(0.2%, -0.2%); }
    100% { transform: scale(1.01) translate(-0.1%, 0.2%); }
  }

  #bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(0,0,0,0.0) 0%,
        rgba(0,0,0,0.0) 18%,
        rgba(0,0,0,0.00) 40%,
        rgba(0,0,0,0.00) 55%,
        rgba(0,0,0,0.35) 75%,
        rgba(0,0,0,1.00) 100%
      );
  }

  /* ── TOP HEADER BAR ── */
  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 101;
    background: linear-gradient(180deg,
      rgba(22,52,68,1.00) 0%,
      rgba(22,52,68,0.96) 100%
    );
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border-bottom: 2px solid var(--gold);
    padding: 16px 24px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  #header-divider {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%, var(--gold) 15%, var(--gold-light) 50%, var(--gold) 85%, transparent 100%
    );
    z-index: 102;
  }

  /* Header left column */
  #header-left {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #wordmark { display: flex; flex-direction: column; gap: 1px; }
  #wordmark .dh-logo {
    font-family: 'Cinzel', serif;
    font-weight: 400;
    font-size: clamp(14px, 3.5vw, 20px);
    letter-spacing: 0.10em;
    color: var(--warm-white);
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  #wordmark .dh-logo .d-letter { font-style: italic; color: var(--gold-light); }
  #wordmark .dh-sub {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: clamp(7px, 1.8vw, 9px);
    letter-spacing: 0.38em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.85;
  }

  #welcome-block { display: flex; flex-direction: column; gap: 1px; }
  #greeting-line {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: clamp(9px, 2vw, 11px);
    letter-spacing: 0.28em;
    color: var(--gold-light);
    text-transform: uppercase;
  }
  #welcome-name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(18px, 5vw, 30px);
    letter-spacing: 0.04em;
    color: var(--warm-white);
    text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    line-height: 1.0;
  }

  /* Right column */
  #info-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }
  #weather-time-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #weather-block {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'Raleway', sans-serif;
  }
  #weather-icon { font-size: clamp(16px, 4vw, 20px); line-height: 1; }
  #weather-temp {
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 300;
    color: var(--warm-white);
    letter-spacing: 0.02em;
  }
  #weather-desc {
    font-size: clamp(9px, 2vw, 11px);
    font-weight: 200;
    color: rgba(255,248,238,0.7);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    align-self: flex-end;
    margin-bottom: 2px;
  }
  /* Hide weather desc on small screens to save space */
  @media (max-width: 480px) { #weather-desc { display: none; } }

  #time-block { display: flex; flex-direction: column; align-items: flex-end; }
  #time-display {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(20px, 5vw, 30px);
    color: var(--warm-white);
    letter-spacing: 0.06em;
    line-height: 1.0;
  }
  #date-display {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: clamp(8px, 1.8vw, 10px);
    letter-spacing: 0.25em;
    color: var(--gold-light);
    text-transform: uppercase;
    opacity: 0.85;
    margin-top: 1px;
    white-space: nowrap;
  }

  /* ── BOTTOM GOLD MENU BAR ── */
  #menu-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 101;
    background: linear-gradient(180deg,
      rgba(180,138,42,1.00) 0%,
      rgba(160,118,30,1.00) 100%
    );
    border-top: 1.5px solid rgba(255,220,100,0.4);
    /* height adapts to content */
    padding: 8px 8px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    justify-content: space-around;
  }

  .menu-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: transform 0.3s ease, filter 0.3s;
    /* let items shrink/grow */
    flex: 1;
    min-width: 0;
    padding: 6px 4px;
    border-radius: 4px;
    position: relative;
  }
  .menu-item::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.0);
    border-radius: 4px;
    transition: background 0.25s;
  }
  .menu-item:hover { transform: translateY(-3px); filter: brightness(1.15); }
  .menu-item:hover::after { background: rgba(255,255,255,0.08); }

  .menu-icon {
    width: clamp(28px, 7vw, 40px);
    height: clamp(28px, 7vw, 40px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .menu-icon svg {
    width: 100%; height: 100%;
    fill: rgba(20,50,65,0.9);
  }
  .menu-label {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(8px, 2vw, 11px);
    letter-spacing: 0.12em;
    color: rgba(20,50,65,0.92);
    text-transform: uppercase;
    text-align: center;
    line-height: 1.2;
  }
  .menu-sublabel {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: clamp(7px, 1.5vw, 9px);
    letter-spacing: 0.1em;
    color: rgba(20,50,65,0.6);
    text-transform: uppercase;
    text-align: center;
  }
  /* Hide sublabels on small screens */
  @media (max-width: 520px) { .menu-sublabel { display: none; } }

  .menu-divider {
    width: 1px;
    height: 48px;
    background: linear-gradient(180deg, transparent, rgba(20,50,65,0.2), transparent);
    flex-shrink: 0;
  }

  /* ── MUSIC BUTTON ── */
  #music-btn {
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    background: rgba(22,52,68,0.80);
    border: 1px solid rgba(201,168,76,0.4);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 4px 16px 6px;
    color: var(--gold-light);
    font-family: 'Raleway', sans-serif;
    font-size: clamp(8px, 2vw, 10px);
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 201;
    transition: all 0.3s;
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  #music-btn:hover {
    background: rgba(201,168,76,0.2);
    border-color: rgba(201,168,76,0.7);
  }

  #weather-loading {
    font-size: 11px;
    color: rgba(255,248,238,0.5);
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    letter-spacing: 0.15em;
  }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  body { animation: fadeIn 1.5s ease-out; }
</style>
</head>
<body>

<div id="bg"></div>

<button id="music-btn" onclick="handleMusicBtn()">♪ Play Music</button>

<div id="header-divider"></div>
<div id="header">
  <div id="header-left">
    <div id="wordmark">
      <div class="dh-logo"><span class="d-letter">D</span>isneyland Hotel</div>
    </div>
    <div id="welcome-block">
      <div id="greeting-line">Good Evening</div>
      <div id="welcome-name">Cooke Family</div>
    </div>
  </div>

  <div id="info-right">
    <div id="weather-time-row">
      <div id="weather-block">
        <span id="weather-icon">☀️</span>
        <span id="weather-temp"><span id="weather-loading" style="font-size:11px;opacity:0.5">–</span></span>
        <span id="weather-desc"></span>
      </div>
      <div id="time-block">
        <div id="time-display">–:– –M</div>
        <div id="date-display">Loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM MENU BAR -->
<div id="menu-bar">

  <div class="menu-item" onclick="window.location.href='updates.html'">
    <div class="menu-icon">
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="9" r="6"/>
        <circle cx="25" cy="9" r="6"/>
        <circle cx="18" cy="22" r="11"/>
      </svg>
    </div>
    <div class="menu-label">Disney<br>Updates</div>
  </div>

  <div class="menu-divider"></div>

  <div class="menu-item" onclick="window.open('https://disneyland.disney.go.com/calendars/day/#/disneyland,downtown-disney-district,disney-california-adventure/', '_blank')">
    <div class="menu-icon">
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(20,50,65,0.9)" stroke-width="2.5"/>
        <circle cx="18" cy="18" r="15"/>
        <line x1="18" y1="18" x2="18" y2="8" stroke="rgba(180,138,42,1)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="18" y1="18" x2="24" y2="21" stroke="rgba(180,138,42,1)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="18" cy="18" r="1.5" fill="rgba(180,138,42,1)"/>
      </svg>
    </div>
    <div class="menu-label">Park<br>Hours</div>
    <div class="menu-sublabel">Today's Schedule</div>
  </div>

  <div class="menu-divider"></div>

  <div class="menu-item" onclick="window.open('https://disneyland.disney.go.com/maps/', '_blank')">
    <div class="menu-icon">
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <polygon points="2,6 12,2 24,6 34,2 34,30 24,34 12,30 2,34" fill="none" stroke="rgba(20,50,65,0.9)" stroke-width="2.5"/>
        <polygon points="2,6 12,2 24,6 34,2 34,30 24,34 12,30 2,34"/>
        <polyline points="12,2 12,30" stroke="rgba(180,138,42,0.7)" stroke-width="1.5" fill="none"/>
        <polyline points="24,6 24,34" stroke="rgba(180,138,42,0.7)" stroke-width="1.5" fill="none"/>
      </svg>
    </div>
    <div class="menu-label">Resort<br>Map</div>
    <div class="menu-sublabel">Navigate</div>
  </div>

  <div class="menu-divider"></div>

  <div class="menu-item" onclick="window.open('https://disneyland.disney.go.com/dining/', '_blank')">
    <div class="menu-icon">
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <rect x="6.5" y="2" width="2.5" height="32" rx="1.2"/>
        <path d="M5,2 Q5,11 9,15 Q13,11 13,2Z"/>
        <rect x="25" y="2" width="2.5" height="32" rx="1.2"/>
        <path d="M22,2 Q22,10 27.5,14 Q27.5,2 27.5,2Z"/>
      </svg>
    </div>
    <div class="menu-label">Dining</div>
    <div class="menu-sublabel">Reservations</div>
  </div>

  <div class="menu-divider"></div>

  <div class="menu-item" onclick="window.location.href='waittimes.html'">
    <div class="menu-icon">
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <rect x="13" y="18" width="10" height="14"/>
        <rect x="9" y="22" width="6" height="10"/>
        <rect x="21" y="22" width="6" height="10"/>
        <rect x="10" y="18" width="4" height="6"/>
        <rect x="22" y="18" width="4" height="6"/>
        <polygon points="18,4 22,12 14,12"/>
        <rect x="10" y="14" width="4" height="5"/>
        <rect x="22" y="14" width="4" height="5"/>
        <rect x="15" y="24" width="6" height="8"/>
      </svg>
    </div>
    <div class="menu-label">Wait<br>Times</div>
  </div>

</div>

<iframe id="sc-player"
  src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/sergio-meza-26/disneyland-resort-esplanade&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
  style="position:absolute;top:-9999px;left:-9999px;width:1px;height:1px;"
  allow="autoplay">
</iframe>

<script>
function updateClock() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  document.getElementById('time-display').textContent =
    h12 + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const w = window.innerWidth;
  // Shorter date on mobile
  if (w < 420) {
    document.getElementById('date-display').textContent =
      days[now.getDay()].slice(0,3).toUpperCase() + ' ' + months[now.getMonth()] + ' ' + now.getDate();
  } else {
    document.getElementById('date-display').textContent =
      days[now.getDay()].toUpperCase() + ', ' + months[now.getMonth()].toUpperCase() + ' ' + now.getDate();
  }
  const greet = h >= 5 && h < 12 ? 'Good Morning' :
                h >= 12 && h < 17 ? 'Good Afternoon' :
                h >= 17 && h < 21 ? 'Good Evening' : 'Good Night';
  document.getElementById('greeting-line').textContent = greet;
}
updateClock();
setInterval(updateClock, 30000);
window.addEventListener('resize', updateClock);

function fetchWeather(lat, lon) {
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
    '&longitude=' + lon +
    '&current_weather=true&temperature_unit=fahrenheit&wind_speed_unit=mph';
  fetch(url)
    .then(r => r.json())
    .then(data => {
      const cw = data.current_weather;
      const temp = Math.round(cw.temperature) + '°F';
      const code = cw.weathercode;
      let icon = '☀️', desc = 'Clear';
      if (code >= 1 && code <= 3) { icon = '⛅'; desc = 'Partly Cloudy'; }
      if (code >= 45 && code <= 48) { icon = '🌫️'; desc = 'Foggy'; }
      if (code >= 51 && code <= 67) { icon = '🌧️'; desc = 'Rain'; }
      if (code >= 71 && code <= 77) { icon = '❄️'; desc = 'Snow'; }
      if (code >= 80 && code <= 82) { icon = '🌦️'; desc = 'Showers'; }
      if (code >= 95) { icon = '⛈️'; desc = 'Thunderstorm'; }
      document.getElementById('weather-loading').style.display = 'none';
      document.getElementById('weather-temp').textContent = temp;
      document.getElementById('weather-icon').textContent = icon;
      document.getElementById('weather-desc').textContent = desc;
    })
    .catch(() => {
      document.getElementById('weather-loading').textContent = '';
    });
}

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
    () => fetchWeather(33.8366, -117.9143)
  );
} else {
  fetchWeather(33.8366, -117.9143);
}

const scScript = document.createElement('script');
scScript.src = 'https://w.soundcloud.com/player/api.js';
document.head.appendChild(scScript);

let scWidget = null, scReady = false, scPlaying = false;

scScript.onload = function() {
  scWidget = SC.Widget(document.getElementById('sc-player'));
  scWidget.bind(SC.Widget.Events.READY, function() {
    scReady = true;
    scWidget.setVolume(40);
  });
  scWidget.bind(SC.Widget.Events.PLAY,  function() { scPlaying = true; });
  scWidget.bind(SC.Widget.Events.PAUSE, function() { scPlaying = false; });
};

function handleMusicBtn() {
  const btn = document.getElementById('music-btn');
  if (!scReady) return;
  if (scPlaying) {
    scWidget.pause();
    btn.textContent = '♪ Play Music';
  } else {
    scWidget.play();
    btn.textContent = '♪ Pause Music';
  }
}
</script>


</body>
</html>
