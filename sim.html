<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Key TV — Park Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lato:wght@300;400;700&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a84c; --teal: #0f6e56;
    --bg: #0a0f0a; --bg2: #111811;
    --text: #e8e0c8; --text-dim: #9a9080; --border: #c9a84c22;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Lato', sans-serif; overflow: hidden; display: flex; flex-direction: column; }
  #topbar { display: flex; align-items: center; gap: 16px; padding: 8px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); height: 48px; }
  #topbar h1 { font-family: 'Cinzel', serif; font-size: 16px; color: var(--gold); letter-spacing: 2px; white-space: nowrap; }
  #topbar .sep { width: 1px; height: 20px; background: var(--border); }
  #topbar .sub { font-family: 'Raleway', sans-serif; font-size: 10px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; }
  #clock { margin-left: auto; font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold); letter-spacing: 1px; }
  #data-badge { font-size: 10px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-dim); white-space: nowrap; }
  #controls { display: flex; gap: 8px; align-items: center; padding: 8px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .btn { font-family: 'Raleway', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; padding: 5px 14px; border-radius: 5px; border: 1px solid #c9a84c44; background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: #c9a84c11; color: var(--text); }
  .btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }
  .btn.gold { color: var(--gold); border-color: #c9a84c55; }
  .btn.gold:hover { background: #c9a84c22; }
  .btn.gold.placed { background: var(--gold); color: #1a1200; border-color: var(--gold); }
  #status-bar { display: flex; gap: 20px; font-size: 10px; color: var(--text-dim); margin-left: auto; font-family: 'Raleway', sans-serif; }
  #status-bar span { white-space: nowrap; }
  #status-bar .highlight { color: var(--gold); }
  #canvas-wrap { position: relative; flex: 1; overflow: hidden; min-height: 0; }
  #c { display: block; width: 100%; height: 100%; }
  #legend { display: flex; gap: 14px; align-items: center; padding: 6px 20px; background: var(--bg2); border-top: 1px solid var(--border); flex-wrap: wrap; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-dim); font-family: 'Raleway', sans-serif; }
  .ld { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  #nav { display: flex; align-items: stretch; background: var(--bg2); border-top: 1px solid var(--border); height: 40px; }
  #nav a { flex: 1; display: flex; align-items: center; justify-content: center; font-family: 'Raleway', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); text-decoration: none; border-right: 1px solid var(--border); transition: all 0.15s; }
  #nav a:last-child { border-right: none; }
  #nav a:hover { color: var(--gold); background: #c9a84c0a; }
  #nav a.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
  #modal-overlay { display: none; position: absolute; inset: 0; background: #00000099; align-items: center; justify-content: center; z-index: 100; }
  #modal-overlay.show { display: flex; }
  #modal-card { background: #0d1f0d; border: 1px solid var(--gold); border-radius: 12px; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; align-items: center; min-width: 260px; }
  .modal-title { font-family: 'Cinzel', serif; color: var(--gold); font-size: 14px; text-align: center; letter-spacing: 1px; }
  .modal-sub { font-size: 11px; color: var(--text-dim); text-align: center; font-family: 'Raleway', sans-serif; }
  #name-input { background: #1a2a1a; border: 1px solid #c9a84c55; border-radius: 6px; color: var(--text); font-size: 15px; padding: 8px 14px; width: 100%; outline: none; font-family: 'Lato', sans-serif; text-align: center; }
  #name-input:focus { border-color: var(--gold); }
  .modal-btns { display: flex; gap: 10px; width: 100%; }
  #btn-confirm { flex: 2; padding: 8px; background: var(--gold); color: #1a1200; border: none; border-radius: 6px; font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
  #btn-confirm:hover { background: #d4b060; }
  #btn-cancel { flex: 1; padding: 8px; background: transparent; color: var(--text-dim); border: 1px solid #c9a84c33; border-radius: 6px; font-family: 'Raleway', sans-serif; font-size: 11px; cursor: pointer; }
  #tooltip { position: absolute; background: #0a1a0add; border: 1px solid #c9a84c66; border-radius: 8px; padding: 8px 12px; font-size: 11px; pointer-events: none; display: none; z-index: 50; color: var(--text); min-width: 140px; font-family: 'Raleway', sans-serif; }
  #tooltip b { font-family: 'Cinzel', serif; color: var(--gold); font-size: 12px; }
  .t-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 3px; }
  .t-label { color: var(--text-dim); }
</style>
</head>
<body>
<div id="topbar">
  <h1>MAGIC KEY TV</h1>
  <div class="sep"></div>
  <div class="sub">Park Simulation</div>
  <div id="data-badge">Loading wait times...</div>
  <div id="clock">8:00 AM</div>
</div>
<div id="controls">
  <button class="btn active" id="btn-play">⏸ Pause</button>
  <button class="btn" id="btn-speed">1× speed</button>
  <button class="btn gold" id="btn-addme">+ Add Me</button>
  <button class="btn" id="btn-refresh">↻ Refresh data</button>
  <button class="btn" id="btn-heatmap" onclick="toggleHeatmap()">🌡 Heat Map</button>
  <button class="btn" id="btn-debug" onclick="showDebug()">🔍 Debug names</button>
  <button class="btn" id="btn-paths" onclick="togglePaths()">Show Paths</button>
  <div id="status-bar">
    <span id="st-guests">—</span>
    <span id="st-me" class="highlight"></span>
  </div>
</div>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="modal-overlay">
    <div id="modal-card">
      <div class="modal-title">Welcome, Guest</div>
      <div class="modal-sub">What name shall we put on your lanyard?</div>
      <input id="name-input" type="text" maxlength="16" placeholder="Your name..." autocomplete="off">
      <div class="modal-btns">
        <button id="btn-cancel">Cancel</button>
        <button id="btn-confirm">Enter the Park ✦</button>
      </div>
    </div>
  </div>
  <div id="tooltip"></div>
  <div id="debug-overlay" style="display:none;position:absolute;inset:0;background:#000000cc;z-index:200;overflow-y:auto;padding:20px;font-family:monospace;font-size:12px;color:#e8e0c8;">
    <button onclick="document.getElementById('debug-overlay').style.display='none'" style="position:sticky;top:0;float:right;background:#c9a84c;border:none;padding:6px 12px;cursor:pointer;font-weight:bold;border-radius:4px;">✕ Close</button>
    <h3 style="color:#c9a84c;margin-bottom:12px;font-family:Cinzel,serif;">Supabase ride_name values</h3>
    <div id="debug-content">Loading...</div>
  </div>
</div>
<div id="legend">
  <div class="leg"><div class="ld" style="background:#4a9fd4"></div>Walking</div>
  <div class="leg"><div class="ld" style="background:#e05050"></div>In queue</div>
  <div class="leg"><div class="ld" style="background:#9b59b6"></div>On ride</div>
  <div class="leg"><div class="ld" style="background:#c9a84c"></div>You</div>
  <div class="leg" style="margin-left:12px"><div class="ld" style="background:#2ecc71"></div>≤20 min</div>
  <div class="leg"><div class="ld" style="background:#e67e22"></div>21–45 min</div>
  <div class="leg"><div class="ld" style="background:#e74c3c"></div>45+ min</div>
  <div class="leg" id="heat-legend" style="display:none;margin-left:12px;color:var(--gold)">🌡 Heat map on</div>
</div>
<nav id="nav">
  <a href="index.html">Home</a>
  <a href="waittimes.html">Wait Times</a>
  <a href="predict.html">Predictor</a>
  <a href="sim.html" class="active">Park Sim</a>
  <a href="updates.html">Updates</a>
  <a href="streams.html">Streams</a>
  <a href="survey.html">Survey</a>
  <a href="mapview.html">Map</a>
</nav>

// Map aspect ratio: 1024 x 986
const MAP_AR = 1024 / 986;
let mapOffX = 0, mapOffY = 0, mapDrawW = 0, mapDrawH = 0;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = canvas.width = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
  // Fit map into canvas preserving aspect ratio (letterbox/pillarbox)
  if (W / H > MAP_AR) {
    // Canvas is wider than map ratio — pillarbox (black sides)
    mapDrawH = H;
    mapDrawW = H * MAP_AR;
    mapOffX = (W - mapDrawW) / 2;
    mapOffY = 0;
  } else {
    // Canvas is taller than map ratio — letterbox (black top/bottom)
    mapDrawW = W;
    mapDrawH = W / MAP_AR;
    mapOffX = 0;
    mapOffY = (H - mapDrawH) / 2;
  }
}
resize();
window.addEventListener('resize', resize);

const ADJ = {};
NODES.forEach(n => ADJ[n.id] = []);
EDGES.forEach(([a,b]) => { ADJ[a].push(b); ADJ[b].push(a); });

function astar(startId, goalId) {
  if (startId === goalId) return [startId];
  const open = new Set([startId]);
  const cameFrom = {};
  const gScore = {}; NODES.forEach(n => gScore[n.id] = Infinity);
  gScore[startId] = 0;
  const fScore = {}; NODES.forEach(n => fScore[n.id] = Infinity);
  const goalNode = NODES.find(n => n.id === goalId);
  function h(id) { const nd = NODES.find(n => n.id === id); return Math.hypot(nd.x - goalNode.x, nd.y - goalNode.y); }
  fScore[startId] = h(startId);
  while (open.size > 0) {
    let current = [...open].reduce((a,b) => fScore[a] < fScore[b] ? a : b);
    if (current === goalId) {
      const path = []; let c = current;
      while (c !== undefined) { path.unshift(c); c = cameFrom[c]; }
      return path;
    }
    open.delete(current);
    for (const nb of (ADJ[current] || [])) {
      const nd = NODES.find(n => n.id === nb);
      const cn = NODES.find(n => n.id === current);
      const tentG = gScore[current] + Math.hypot(nd.x - cn.x, nd.y - cn.y);
      if (tentG < gScore[nb]) {
        cameFrom[nb] = current; gScore[nb] = tentG;
        fScore[nb] = tentG + h(nb); open.add(nb);
      }
    }
  }
  return [startId, goalId];
}

function nearestNode(x, y) {
  let best = NODES[0], bd = Infinity;
  NODES.forEach(n => { const d = Math.hypot(n.x - x, n.y - y); if (d < bd) { bd = d; best = n; } });
  return best.id;
}


function pickTarget(g) {
  const weights = RIDES.map(r => 1 / (rideWait(r.db) + 5));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total, chosen = RIDES[RIDES.length - 1];
  for (let i = 0; i < RIDES.length; i++) { r -= weights[i]; if (r <= 0) { chosen = RIDES[i]; break; } }
  g.target = chosen;
  const startNode = nearestNode(g.x, g.y);
  const goalNode  = nearestNode(chosen.x, chosen.y);
  const pathIds   = astar(startNode, goalNode);
  g.waypoints = pathIds.map(id => NODES.find(n => n.id === id));
  g.waypoints.push({ x: chosen.x + rand(-4,4), y: chosen.y + rand(-4,4) });
  g.wpIdx = 0;
  g.state = 'walking';
}

function updateGuest(g, dt) {
  if (g.state === 'walking') {
    if (!g.waypoints || g.wpIdx >= g.waypoints.length) {
      g.state = 'queuing'; g.waitLeft = rideWait(g.target?.db) * rand(0.8, 1.2); return;
    }
    const wp = g.waypoints[g.wpIdx];
    const dx = wp.x - g.x, dy = wp.y - g.y, d = Math.hypot(dx, dy);
    if (d < 3) {
      g.x = wp.x; g.y = wp.y; g.wpIdx++;
      if (g.wpIdx >= g.waypoints.length) { g.state = 'queuing'; g.waitLeft = rideWait(g.target?.db) * rand(0.8, 1.2); }
    } else {
      const spd = 22 * dt;
      g.x += dx / d * spd; g.y += dy / d * spd;
      if (g.isMe) { g.trail.push({ x: g.x, y: g.y }); if (g.trail.length > 30) g.trail.shift(); }
    }
  } else if (g.state === 'queuing') {
    g.waitLeft -= dt; if (g.waitLeft <= 0) { g.state = 'riding'; g.rideLeft = rand(3, 6); }
  } else if (g.state === 'riding') {
    g.rideLeft -= dt; if (g.rideLeft <= 0) { g.ridesDone++; pickTarget(g); }
  }
}

function waitColor(m) {
  if (m == null) return '#555';
  if (m <= 20) return '#2ecc71';
  if (m <= 45) return '#e67e22';
  return '#e74c3c';
}
function rideWait(db) { return waitData[db] ?? 25; }

async function fetchWaits() {
  const h = new Date().getHours(), dow = new Date().getDay();
  document.getElementById('data-badge').textContent = 'Fetching...';
  const url = `${SUPABASE_URL}/rest/v1/wait_times?park=eq.dl&select=ride_name,wait_time&order=recorded_at.desc&limit=500`;
  try {
    const res = await fetch(url, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    const agg = {}, cnt = {};
    rows.forEach(r => {
      if (r.wait_time === null) return;
      if (!agg[r.ride_name]) { agg[r.ride_name] = 0; cnt[r.ride_name] = 0; }
      agg[r.ride_name] += r.wait_time; cnt[r.ride_name]++;
    });
    Object.keys(agg).forEach(k => { waitData[k] = Math.round(agg[k] / cnt[k]); });
    const allNames = [...new Set(rows.map(r => r.ride_name))];
    allNames.forEach(k => { if (waitData[k] === undefined) waitData[k] = 0; });
    const matched = RIDES.filter(r => waitData[r.db] !== undefined).length;
    const badge = document.getElementById('data-badge');
    badge.textContent = `Live data — ${matched}/${RIDES.length} rides`;
    badge.style.color = matched > 6 ? '#2ecc71' : '#e67e22';
  } catch (e) {
    document.getElementById('data-badge').textContent = 'Estimated waits';
    document.getElementById('data-badge').style.color = '#e67e22';
    RIDES.forEach(r => { waitData[r.db] = Math.round(10 + Math.random() * 55); });
  }
}

function sx(x) { return mapOffX + x * mapDrawW / LW; }
function sy(y) { return mapOffY + y * mapDrawH / LH; }
function sw(w) { return w * mapDrawW / LW; }

const NAMES = ['Alex','Jordan','Taylor','Morgan','Casey','Riley','Sam','Dana','Avery','Quinn','Blake','Skyler','Peyton','Jamie','Drew','Reese','Parker','Sage','Chris','Cameron'];
function rand(a, b) { return a + Math.random() * (b - a); }

function drawFrame() {
  ctx.clearRect(0, 0, W, H);
  if (mapImg.complete && mapImg.naturalWidth > 0) {
    ctx.fillStyle = '#0a0f0a'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(mapImg, mapOffX, mapOffY, mapDrawW, mapDrawH);
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(mapOffX, mapOffY, mapDrawW, mapDrawH);
  } else {
    ctx.fillStyle = '#0a0f0a'; ctx.fillRect(0, 0, W, H);
  }

  if (showPaths) drawPaths();

  if (showHeatmap) drawHeatmap();

  RIDES.forEach(r => {
    const w = waitData[r.db], col = waitColor(w);
    ctx.beginPath(); ctx.arc(sx(r.x), sy(r.y), sw(8), 0, Math.PI * 2);
    ctx.fillStyle = col + '22'; ctx.fill();
    ctx.beginPath(); ctx.arc(sx(r.x), sy(r.y), sw(5), 0, Math.PI * 2);
    ctx.fillStyle = col + 'bb'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    if (w !== undefined) {
      const lx = sx(r.x), ly = sy(r.y) - sw(11);
      ctx.font = `bold ${sw(7.5)}px Lato,sans-serif`; ctx.textAlign = 'center';
      ctx.fillStyle = '#000000aa'; ctx.fillText(w + 'm', lx+1, ly+1);
      ctx.fillStyle = '#ffffffee'; ctx.fillText(w + 'm', lx, ly);
    }
  });

  [...guests].sort((a, b) => (a.isMe ? 1 : 0) - (b.isMe ? 1 : 0)).forEach(g => {
    if (g.isMe && g.trail.length > 1) {
      ctx.beginPath(); ctx.moveTo(sx(g.trail[0].x), sy(g.trail[0].y));
      g.trail.forEach(p => ctx.lineTo(sx(p.x), sy(p.y)));
      ctx.strokeStyle = '#c9a84c55'; ctx.lineWidth = 2; ctx.stroke();
    }
    const r = g.isMe ? sw(9) : sw(4.5);
    const col = g.isMe ? '#c9a84c' : g.state === 'queuing' ? '#e05050' : g.state === 'riding' ? '#9b59b6' : '#4a9fd4';
    ctx.beginPath(); ctx.arc(sx(g.x)+1, sy(g.y)+1, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
    ctx.beginPath(); ctx.arc(sx(g.x), sy(g.y), r, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill();
    if (g.isMe) { ctx.strokeStyle = '#1a1200'; ctx.lineWidth = 2; ctx.stroke(); }
    if (g.state !== 'walking') {
      ctx.beginPath(); ctx.arc(sx(g.x), sy(g.y), r + sw(3.5), 0, Math.PI * 2);
      ctx.strokeStyle = col + '55'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    if (g.isMe) {
      const lx = sx(g.x), ly = sy(g.y) - sw(14);
      ctx.font = `bold ${sw(9)}px Cinzel,serif`; ctx.textAlign = 'center';
      ctx.fillStyle = '#000000cc'; ctx.fillText(playerName, lx+1, ly+1);
      ctx.fillStyle = '#c9a84c'; ctx.fillText(playerName, lx, ly);
    }
  });
}

function formatTime(m) {
  const h = Math.floor(m / 60) % 24, mn = Math.floor(m % 60);
  const ap = h >= 12 ? 'PM' : 'AM', hh = h > 12 ? h - 12 : h === 0 ? 12 : h;
  return `${hh}:${mn.toString().padStart(2, '0')} ${ap}`;
}

const heatCanvas = document.createElement('canvas');
const heatCtx = heatCanvas.getContext('2d');

function drawHeatmap() {
  // Keep offscreen canvas in sync with main canvas size
  if (heatCanvas.width !== W || heatCanvas.height !== H) {
    heatCanvas.width = W;
    heatCanvas.height = H;
  }
  heatCtx.clearRect(0, 0, W, H);

  RIDES.forEach(r => {
    const w = waitData[r.db];
    if (w == null) return;

    const cx = sx(r.x);
    const cy = sy(r.y);

    // Radius scales with wait time: 5 min → small bloom, 90+ min → big bloom
    const minR = sw(18);
    const maxR = sw(90);
    const t = Math.min(w / 75, 1); // normalise 0–75 min → 0–1
    const radius = minR + t * (maxR - minR);

    // Color: green (low) → orange → red (high)
    // We blend in the gradient from hot core to transparent edge
    let r1, g1, b1;
    if (w <= 20) {
      r1 = 46; g1 = 204; b1 = 113;   // green
    } else if (w <= 45) {
      const tt = (w - 20) / 25;
      r1 = Math.round(46 + tt * (230 - 46));
      g1 = Math.round(204 + tt * (126 - 204));
      b1 = Math.round(113 + tt * (34 - 113));
    } else {
      const tt = Math.min((w - 45) / 45, 1);
      r1 = Math.round(230 + tt * (231 - 230));
      g1 = Math.round(126 + tt * (76 - 126));
      b1 = Math.round(34 + tt * (60 - 34));
    }

    const grad = heatCtx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    const alpha = 0.18 + t * 0.22; // more opaque for longer waits
    grad.addColorStop(0,   `rgba(${r1},${g1},${b1},${alpha})`);
    grad.addColorStop(0.35,`rgba(${r1},${g1},${b1},${(alpha * 0.6).toFixed(3)})`);
    grad.addColorStop(1,   `rgba(${r1},${g1},${b1},0)`);

    heatCtx.beginPath();
    heatCtx.arc(cx, cy, radius, 0, Math.PI * 2);
    heatCtx.fillStyle = grad;
    heatCtx.fill();
  });

  // Composite the heat canvas onto main canvas
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(heatCanvas, 0, 0);
  ctx.restore();
}

function drawPaths() {
  ctx.lineWidth = 1.5;
  EDGES.forEach(([a,b]) => {
    const na = NODES.find(n => n.id === a);
    const nb = NODES.find(n => n.id === b);
    if (!na || !nb) return;
    ctx.beginPath();
    ctx.moveTo(sx(na.x), sy(na.y));
    ctx.lineTo(sx(nb.x), sy(nb.y));
    ctx.strokeStyle = 'rgba(255,220,0,0.6)';
    ctx.stroke();
  });
  NODES.forEach(n => {
    ctx.beginPath();
    ctx.arc(sx(n.x), sy(n.y), sw(4), 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,80,80,0.85)';
    ctx.fill();
    ctx.font = `${sw(7)}px monospace`;
    ctx.fillStyle = 'white';
    ctx.textAlign = 'left';
    ctx.fillText(n.id, sx(n.x)+sw(5), sy(n.y)+sw(3));
  });
}

function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  const dt = (ts - lastTs) / 1000 * speed; lastTs = ts;
  if (!running) { drawFrame(); updateHUD(); document.getElementById('clock').textContent = formatTime(simMins); return; }
  simMins += dt * 0.3;
  guests.forEach(g => updateGuest(g, dt));
  if (guests.length < 80 && Math.random() < 0.006 * speed) guests.push(spawnGuest(guests.length));
  drawFrame(); updateHUD();
  document.getElementById('clock').textContent = formatTime(simMins);
}

document.getElementById('btn-play').onclick = () => {
  running = !running;
  const b = document.getElementById('btn-play');
  b.textContent = running ? '⏸ Pause' : '▶ Play';
  b.className = running ? 'btn active' : 'btn';
};
document.getElementById('btn-speed').onclick = () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length; speed = SPEEDS[speedIdx];
  document.getElementById('btn-speed').textContent = speed + '× speed';
};
document.getElementById('btn-refresh').onclick = fetchWaits;

const modal = document.getElementById('modal-overlay');
const nameInput = document.getElementById('name-input');
document.getElementById('btn-addme').onclick = () => {
  nameInput.value = playerName || '';
  modal.classList.add('show');
  setTimeout(() => nameInput.focus(), 50);
};
document.getElementById('btn-cancel').onclick = () => modal.classList.remove('show');

function confirmName() {
  const n = nameInput.value.trim(); if (!n) return;
  playerName = n; modal.classList.remove('show');
  pendingPlace = true; canvas.style.cursor = 'crosshair';
  document.getElementById('btn-addme').textContent = 'Click to place yourself';
  document.getElementById('btn-addme').className = 'btn gold';
}
document.getElementById('btn-confirm').onclick = confirmName;
nameInput.onkeydown = e => { if (e.key === 'Enter') confirmName(); if (e.key === 'Escape') modal.classList.remove('show'); };

canvas.onclick = e => {
  const rect = canvas.getBoundingClientRect();
  const lx = ((e.clientX - rect.left) * (W / rect.width) - mapOffX) * LW / mapDrawW;
  const ly = ((e.clientY - rect.top) * (H / rect.height) - mapOffY) * LH / mapDrawH;
  if (pendingPlace && playerName) {
    if (myChar) { myChar.x = lx; myChar.y = ly; myChar.trail = []; pickTarget(myChar); }
    else {
      myChar = { id: 9999, name: playerName, x: lx, y: ly, tx: lx, ty: ly, state: 'walking',
        waitLeft: 0, rideLeft: 0, target: null, isMe: true, ridesDone: 0, trail: [], waypoints: [], wpIdx: 0 };
      guests.push(myChar); pickTarget(myChar);
    }
    pendingPlace = false; canvas.style.cursor = 'default';
    document.getElementById('btn-addme').textContent = '✦ ' + playerName;
    document.getElementById('btn-addme').className = 'btn gold placed';
    return;
  }
  let nearest = null, nd = Infinity;
  guests.forEach(g => { const d = Math.hypot(g.x - lx, g.y - ly); if (d < nd) { nd = d; nearest = g; } });
  if (nearest && nd < 20) {
    const tt = document.getElementById('tooltip');
    const w = nearest.target ? waitData[nearest.target.db] : null;
    tt.innerHTML = `<b>${nearest.isMe ? playerName : nearest.name}</b>
      <div class="t-row"><span class="t-label">Status</span><span>${nearest.state}</span></div>
      ${nearest.target ? `<div class="t-row"><span class="t-label">Heading to</span><span>${nearest.target.n}</span></div>` : ''}
      ${w != null ? `<div class="t-row"><span class="t-label">Wait time</span><span style="color:${waitColor(w)}">${w} min</span></div>` : ''}
      <div class="t-row"><span class="t-label">Rides done</span><span>${nearest.ridesDone}</span></div>`;
    const cx = sx(nearest.x), cy = sy(nearest.y);
    tt.style.left = Math.min(cx + 12, W - 160) + 'px';
    tt.style.top = Math.max(cy - 70, 4) + 'px';
    tt.style.display = 'block';
    setTimeout(() => tt.style.display = 'none', 3500);
  }
};

for (let i = 0; i < 60; i++) guests.push(spawnGuest(i));
fetchWaits();
requestAnimationFrame(loop);

</script>
</body>
</html>
