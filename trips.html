<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Trips · Cooke Family Disneyland</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #e8c97a;
    --gold-dim: #7a5f2a;
    --teal: #1a6b6b;
    --teal-dark: #0d3d3d;
    --cream: #fdf8ef;
    --cream-dark: #f0e9d8;
    --bg: #0d1a1a;
    --card: #122222;
    --border: rgba(201,168,76,0.25);
    --star-green: #4caf82;
    --star-green-bg: rgba(76,175,130,0.15);
    --veto-red: #d45050;
    --veto-red-bg: rgba(212,80,80,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
    width: 100%;
  }

  /* ── HEADER ── */
  header {
    background: var(--teal-dark);
    border-bottom: 2px solid var(--gold);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header a { text-decoration: none; }
  .header-home {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 13px;
    letter-spacing: 0.08em;
    opacity: 0.8;
    white-space: nowrap;
  }
  .header-home:hover { opacity: 1; }
  .header-title {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 17px;
    letter-spacing: 0.1em;
    flex: 1;
    text-align: center;
  }
  .header-right { width: 80px; }

  /* ── LAYOUT ── */
  .page { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ── HERO ── */
  .hero {
    text-align: center;
    padding: 36px 0 32px;
  }
  .hero h1 {
    font-family: 'Cinzel', serif;
    font-size: 24px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .hero p {
    color: var(--cream-dark);
    opacity: 0.6;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── LOADING / EMPTY ── */
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(201,168,76,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(253,248,239,0.35);
    font-size: 14px;
    line-height: 1.8;
  }
  .empty-state a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 700;
  }

  /* ── TRIP CARDS ── */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin: 0 0 10px 4px;
  }
  .section-block { margin-bottom: 32px; }

  .trip-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .trip-card-info { flex: 1; min-width: 0; }
  .trip-card-name {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    color: var(--gold);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .trip-card-meta {
    font-size: 12px;
    color: rgba(253,248,239,0.45);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .trip-card-code {
    font-family: monospace;
    font-size: 12px;
    background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 4px;
    padding: 2px 7px;
    color: var(--gold-light);
    letter-spacing: 0.1em;
  }
  .trip-card-date {
    font-size: 12px;
    color: rgba(253,248,239,0.5);
  }
  .trip-card-resp {
    font-size: 12px;
    color: var(--star-green);
  }
  .trip-card-upcoming {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--star-green-bg);
    color: var(--star-green);
    letter-spacing: 0.04em;
  }
  .trip-card-past {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    color: rgba(253,248,239,0.35);
  }

  .trip-card-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    border-radius: 8px;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn-gold { background: var(--gold); color: var(--teal-dark); }
  .btn-gold:hover { background: var(--gold-light); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--cream); opacity: 0.8; }
  .btn-outline:hover { border-color: var(--gold); opacity: 1; }
  .btn-danger { background: transparent; border: 1px solid rgba(212,80,80,0.35); color: var(--veto-red); }
  .btn-danger:hover { border-color: var(--veto-red); background: var(--veto-red-bg); }
  .btn-icon { padding: 8px 12px; }

  /* ── NEW TRIP SHORTCUT ── */
  .new-trip-bar {
    display: flex;
    justify-content: center;
    margin-bottom: 36px;
  }

  /* ── COPY TOAST ── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--teal);
    color: var(--cream);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── CONFIRM DIALOG ── */
  .confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .confirm-overlay.open { display: flex; }
  .confirm-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
  }
  .confirm-title {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .confirm-body {
    font-size: 14px;
    color: rgba(253,248,239,0.65);
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .confirm-body strong { color: var(--cream); }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>

<header>
  <a class="header-home" href="index.html">← Home</a>
  <div class="header-title">All Trips</div>
  <a class="header-home" href="survey.html" style="font-size:12px;opacity:0.7;white-space:nowrap;">New Survey</a>
</header>

<div class="page">
  <div class="hero">
    <h1>Trip History</h1>
    <p>All saved surveys. Open any trip to view results or continue collecting ratings.</p>
  </div>

  <div class="new-trip-bar">
    <a class="btn btn-gold" href="survey.html">+ Create New Trip</a>
  </div>

  <div id="trips-container"><div class="spinner"></div></div>
</div>

<!-- CONFIRM DELETE DIALOG -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">Delete Trip</div>
    <div class="confirm-body" id="confirm-body">Are you sure?</div>
    <div class="confirm-actions">
      <button class="btn btn-outline" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirm-yes">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, getDoc, doc, deleteDoc, query, orderBy }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAprWH3naFPXPRgSr9qTbq2rbEntYpJ5Pw",
  authDomain: "disneyland-rides.firebaseapp.com",
  projectId: "disneyland-rides",
  storageBucket: "disneyland-rides.firebasestorage.app",
  messagingSenderId: "940661410999",
  appId: "1:940661410999:web:b557cf468a338669821132"
};

const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);

// ── LOAD ALL TRIPS ──
async function loadTrips() {
  const container = document.getElementById('trips-container');
  try {
    const tripsSnap = await getDocs(collection(db, 'trips'));
    if (tripsSnap.empty) {
      container.innerHTML = `<div class="empty-state">No trips yet.<br><a href="survey.html">Create your first trip →</a></div>`;
      return;
    }

    // Load all trips and their response counts in parallel
    const trips = await Promise.all(tripsSnap.docs.map(async d => {
      const data = d.data();
      const respSnap = await getDocs(collection(db, 'trips', d.id, 'responses'));
      return {
        id: d.id,
        name: data.name || 'Unnamed Trip',
        date: data.date || '',
        createdAt: data.createdAt?.toDate() || null,
        respondents: respSnap.size
      };
    }));

    // Sort: upcoming first (by trip date desc), then no-date, then past
    const today = new Date(); today.setHours(0,0,0,0);
    const upcoming = trips.filter(t => t.date && new Date(t.date + 'T12:00:00') >= today)
      .sort((a, b) => new Date(a.date) - new Date(b.date));
    const past = trips.filter(t => t.date && new Date(t.date + 'T12:00:00') < today)
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    const nodates = trips.filter(t => !t.date)
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

    let html = '';

    if (upcoming.length) {
      html += `<div class="section-block"><div class="section-label">Upcoming</div>`;
      upcoming.forEach(t => { html += tripCard(t, 'upcoming'); });
      html += `</div>`;
    }
    if (nodates.length) {
      html += `<div class="section-block"><div class="section-label">No date set</div>`;
      nodates.forEach(t => { html += tripCard(t, 'none'); });
      html += `</div>`;
    }
    if (past.length) {
      html += `<div class="section-block"><div class="section-label">Past trips</div>`;
      past.forEach(t => { html += tripCard(t, 'past'); });
      html += `</div>`;
    }

    container.innerHTML = html;
  } catch(err) {
    container.innerHTML = `<div class="empty-state">Could not load trips. Check your connection and refresh.</div>`;
    console.error(err);
  }
}

function tripCard(t, kind) {
  const surveyUrl = `survey.html?trip=${t.id}`;
  const fullUrl = location.href.replace('trips.html', '') + `survey.html?trip=${t.id}`;

  let dateStr = '';
  let badge = '';
  if (t.date) {
    const d = new Date(t.date + 'T12:00:00');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    dateStr = `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

    if (kind === 'upcoming') {
      const today = new Date(); today.setHours(0,0,0,0);
      const diff = Math.round((d - today) / 86400000);
      badge = diff === 0
        ? `<span class="trip-card-upcoming">Today!</span>`
        : diff === 1
        ? `<span class="trip-card-upcoming">Tomorrow</span>`
        : `<span class="trip-card-upcoming">In ${diff} days</span>`;
    } else if (kind === 'past') {
      badge = `<span class="trip-card-past">Past</span>`;
    }
  }

  const respText = t.respondents === 0
    ? `<span style="color:rgba(253,248,239,0.3)">No responses yet</span>`
    : `<span class="trip-card-resp">${t.respondents} response${t.respondents !== 1 ? 's' : ''}</span>`;

  return `<div class="trip-card" id="card-${t.id}">
    <div class="trip-card-info">
      <div class="trip-card-name">${escHtml(t.name)}</div>
      <div class="trip-card-meta">
        <span class="trip-card-code">${t.id}</span>
        ${dateStr ? `<span class="trip-card-date">${dateStr}</span>` : ''}
        ${badge}
        ${respText}
      </div>
    </div>
    <div class="trip-card-actions">
      <a class="btn btn-gold" href="${surveyUrl}">Open</a>
      <button class="btn btn-outline btn-icon" title="Copy link" onclick="copyLink('${fullUrl}', this)">🔗</button>
      <button class="btn btn-danger btn-icon" title="Delete trip" onclick="confirmDelete('${t.id}', '${escHtml(t.name).replace(/'/g,"\\'")}')">✕</button>
    </div>
  </div>`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── COPY LINK ──
window.copyLink = function(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓';
    btn.style.color = '#4caf82';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 2000);
    toast('Link copied!');
  });
};

// ── DELETE ──
let pendingDeleteId = null;

window.confirmDelete = function(id, name) {
  pendingDeleteId = id;
  document.getElementById('confirm-body').innerHTML = `This will permanently delete <strong>${name}</strong> and all its responses. This cannot be undone.`;
  document.getElementById('confirm-overlay').classList.add('open');
  document.getElementById('confirm-yes').onclick = doDelete;
};

window.closeConfirm = function() {
  pendingDeleteId = null;
  document.getElementById('confirm-overlay').classList.remove('open');
};

async function doDelete() {
  if (!pendingDeleteId) return;
  const id = pendingDeleteId;
  closeConfirm();

  // Delete all responses subcollection docs first, then the trip doc
  try {
    const respSnap = await getDocs(collection(db, 'trips', id, 'responses'));
    await Promise.all(respSnap.docs.map(d => deleteDoc(d.ref)));
    await deleteDoc(doc(db, 'trips', id));

    // Remove card from DOM
    const card = document.getElementById('card-' + id);
    if (card) {
      card.style.opacity = '0';
      card.style.transition = 'opacity 0.3s';
      setTimeout(() => {
        card.remove();
        // If section is now empty, remove it
        document.querySelectorAll('.section-block').forEach(sec => {
          if (!sec.querySelector('.trip-card')) sec.remove();
        });
        // If nothing left at all
        if (!document.querySelector('.trip-card')) {
          document.getElementById('trips-container').innerHTML =
            `<div class="empty-state">No trips yet.<br><a href="survey.html">Create your first trip →</a></div>`;
        }
      }, 300);
    }
    toast('Trip deleted');
  } catch(err) {
    toast('Error deleting trip');
    console.error(err);
  }
}

// ── TOAST ──
window.toast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
};

// Close confirm on overlay click
document.getElementById('confirm-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('confirm-overlay')) closeConfirm();
});

loadTrips();
</script>
</body>
</html>
